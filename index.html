alar, always ≥ 0).<\/div>\n<div class=\"rule\"><b>Displacement, Δx<\/b> — straight-line change in position, \\(\\Delta x = x_f - x_i\\) (direction matters — can be negative).<\/div>\n<div class=\"rule\"><b>Average speed<\/b> \\(= \\dfrac{\\text{whole path}}{\\Delta t} = \\dfrac{d}{\\Delta t}\\) (scalar). <b>Average velocity<\/b> \\(\\bar{v} = \\dfrac{\\Delta x}{\\Delta t}\\) (has direction).<\/div>\n<div class=\"rule\"><b>Instantaneous velocity<\/b> \\(v = \\dfrac{dx}{dt}\\) is the derivative of position; |instantaneous v| = instantaneous speed.<\/div>\n<\/section>\n<section class=\"card\"><h2>Deriving the Kinematic Equations<\/h2>\n<ol class=\"spine\">\n<li><span class=\"step\">Start from the definition of acceleration:<\/span><div>\\(a = \\dfrac{v_f - v_i}{t}\\)<\/div><span class=\"pill\">① \\(v_f = v_i + at\\)<\/span><\/li>\n<li><span class=\"step\">For constant acceleration, average velocity is just the mean of start and end:<\/span><div>\\(\\bar{v} = \\dfrac{x_f - x_i}{t} = \\dfrac{v_i + v_f}{2}\\)<\/div><\/li>\n<li><span class=\"step\">Substitute \\(v_f = v_i + at\\) from Step 1:<\/span><div>\\(\\dfrac{x_f - x_i}{t} = \\dfrac{v_i + (v_i + at)}{2}\\)<\/div><span class=\"pill\">② \\(\\Delta x = v_i t + \\tfrac{1}{2}at^{2}\\)<\/span><\/li>\n<li><span class=\"step\">Eliminate t between ① and ② instead:<\/span><span class=\"pill\">③ \\(v_f^{2} = v_i^{2} + 2a\\Delta x\\)<\/span><\/li>\n<\/ol>\n<p class=\"note\">These three only hold while <b>a stays constant<\/b>. Equation ③ is the one to reach for when time isn't given (or isn't needed) — it skips t entirely.<\/p>\n<\/section>\n<div class=\"grid g2\">\n<section class=\"card\"><h2>Reading v and a Off a Graph<\/h2>\n<figure class=\"diagram\"><svg viewBox=\"0 0 330 150\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"20\" y1=\"10\" x2=\"20\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n<line x1=\"20\" y1=\"85\" x2=\"320\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n<text x=\"10\" y=\"16\" fill=\"currentColor\" font-size=\"11\">x<\/text><text x=\"312\" y=\"99\" fill=\"currentColor\" font-size=\"11\">t<\/text>\n<path d=\"M20,85 C45,40 70,40 95,85 S150,130 170,128 S215,70 245,55 S300,95 318,112\" class=\"acc\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\"/>\n<text x=\"26\" y=\"40\" fill=\"currentColor\" font-size=\"10\">v=+, a=−ve<\/text>\n<circle cx=\"57\" cy=\"52\" r=\"2.5\" fill=\"currentColor\"/><text x=\"50\" y=\"66\" fill=\"currentColor\" font-size=\"10\">v=0<\/text>\n<text x=\"96\" y=\"118\" fill=\"currentColor\" font-size=\"10\">v=−ve, a=0<\/text>\n<text x=\"146\" y=\"146\" fill=\"currentColor\" font-size=\"10\">v=− then +<\/text>\n<text x=\"196\" y=\"50\" fill=\"currentColor\" font-size=\"10\">v=+ve, a=+ve<\/text>\n<\/svg><\/figure>\n<p class=\"note\">Slope of x(t) gives v; slope of v(t) gives a. Where the curve peaks or troughs, v = 0.<\/p>\n<\/section>\n<section class=\"card\"><h2>Worked Example — Motion Laws<\/h2>\n<div class=\"example\"><div class=\"ex-q\">A train travelling at 20 m/s brakes at a constant 2 m/s². How far does it travel before stopping, and how long does that take?<\/div>\n<p>\\(v_f^{2} = v_i^{2} + 2a\\Delta x \\;\\rightarrow\\; 0 = 20^{2} + 2(-2)\\Delta x\\)<\/p>\n<p class=\"ans\">Δx = 100 m<\/p>\n<p>\\(v_f = v_i + at \\;\\rightarrow\\; 0 = 20 + (-2)t\\)<\/p>\n<p class=\"ans\">t = 10 s<\/p><\/div>\n<\/section>\n<\/div>\n<section class=\"card\"><h2>Free Fall (a = −g)<\/h2>\n<p class=\"note\">Take up as positive, so a = −g with g ≈ 9.8 m/s². Substitute into the equations above.<\/p>\n<\/section>\n<div class=\"grid g2\">\n<section class=\"card\"><h3>Case 1 — Free Fall From Rest (\\(v_i = 0\\))<\/h3>\n<p>\\(v_f = -gt \\;\\Longrightarrow\\; t = \\dfrac{v_f}{g}\\)<\/p>\n<p>\\(\\Delta x = -\\tfrac{1}{2}gt^{2} = -h \\;\\Longrightarrow\\; t = \\sqrt{\\dfrac{2h}{g}}\\)<\/p>\n<p>\\(v_f = \\sqrt{2gh}\\)<\/p>\n<\/section>\n<section class=\"card\"><h3>Case 2 — Thrown Upward (returns to start)<\/h3>\n<p>\\(0 = v_i t - \\tfrac{1}{2}gt^{2} \\;\\Longrightarrow\\; t = \\dfrac{2v_i}{g}\\)<\/p>\n<p class=\"note\">At the top, v = 0. By symmetry, time up = time down = \\(\\dfrac{v_i}{g}\\), and max height \\(h = \\dfrac{v_i^{2}}{2g}\\).<\/p>\n<\/section>\n<\/div>\n<section class=\"card\"><h2>Worked Example — Free Fall<\/h2>\n<div class=\"example\"><div class=\"ex-q\">A ball is thrown straight up at 15 m/s. How long until it returns to the thrower's hand, and how high does it go? (g ≈ 9.8 m/s²)<\/div>\n<p>\\(t = \\dfrac{2v_i}{g} = \\dfrac{2(15)}{9.8}\\)<\/p>\n<p class=\"ans\">t ≈ 3.06 s<\/p>\n<p>\\(h = \\dfrac{v_i^{2}}{2g} = \\dfrac{15^{2}}{2\\times9.8}\\)<\/p>\n<p class=\"ans\">h ≈ 11.5 m<\/p><\/div>\n<\/section>\n<section class=\"card\"><h2>Equations of Motion — Quick Reference<\/h2>\n<div class=\"grid g2\">\n<div><p>① \\(v_f = v_i + at\\)<\/p><p>② \\(\\Delta x = v_i t + \\tfrac{1}{2}at^{2}\\)<\/p><p>③ \\(v_f^{2} = v_i^{2} + 2a\\Delta x\\)<\/p><\/div>\n<div><p>\\(\\bar{v} = \\dfrac{v_i + v_f}{2}\\) <span class=\"note\">(constant a only)<\/span><\/p><p class=\"note\">All three assume constant acceleration. Free fall is the special case a = −g.<\/p><\/div>\n<\/div>\n<\/section>\n", "meta": "Chapter Review", "at": 1791538095475}, {"id": "phy101-ch4", "label": "Chapter 4", "title": "Motion in Two Dimensions", "html": "<p class=\"sub\">Projectile Motion · Uniform Circular Motion · Centripetal &amp; Tangential Acceleration<\/p>\n<p class=\"intro\">In 2D the x- and y-motions are independent — each axis follows its own constant-acceleration law. The rules are collected on the right; the worked examples on the left show how to use them.<\/p>\n<div class=\"grid g-wide-left\">\n<div class=\"stack\">\n<section class=\"card\"><h2>Projectile Path<\/h2>\n<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" viewBox=\"0 0 320 150\">\n<path stroke-width=\"2\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" d=\"M20,112 Q160,-50 300,112\"><\/path>\n<line stroke-dasharray=\"4 3\" stroke-width=\"1\" stroke=\"currentColor\" y2=\"112\" x2=\"160\" y1=\"31\" x1=\"160\"><\/line>\n<text font-size=\"11\" fill=\"currentColor\" y=\"78\" x=\"166\">h<\/text>\n<line stroke-width=\"2\" stroke=\"currentColor\" y2=\"72\" x2=\"56\" y1=\"112\" x1=\"20\"><\/line><path fill=\"currentColor\" d=\"M56,72 L46,76 L52,82 Z\"><\/path>\n<text font-size=\"11\" fill=\"currentColor\" y=\"74\" x=\"34\">v<\/text><text font-size=\"8\" fill=\"currentColor\" y=\"77\" x=\"41\">i<\/text>\n<path stroke-width=\"1\" fill=\"none\" stroke=\"currentColor\" d=\"M38,112 A18,18 0 0 0 32,99\"><\/path><text font-size=\"10\" fill=\"currentColor\" y=\"106\" x=\"42\">θ<\/text>\n<line stroke-width=\"2\" stroke=\"currentColor\" y2=\"31\" x2=\"200\" y1=\"31\" x1=\"160\"><\/line><path fill=\"currentColor\" d=\"M204,31 L195,26 L195,36 Z\"><\/path>\n<text font-size=\"11\" fill=\"currentColor\" y=\"35\" x=\"206\">v<\/text><text font-size=\"8\" fill=\"currentColor\" y=\"38\" x=\"213\">x<\/text>\n<text font-size=\"10\" fill=\"currentColor\" y=\"22\" x=\"118\">top: v<\/text><text font-size=\"7\" fill=\"currentColor\" y=\"25\" x=\"148\">y<\/text><text font-size=\"10\" fill=\"currentColor\" y=\"22\" x=\"153\"> = 0<\/text>\n<line stroke-width=\"1\" stroke=\"currentColor\" y2=\"132\" x2=\"300\" y1=\"132\" x1=\"20\"><\/line><path fill=\"currentColor\" d=\"M20,132 L28,128 L28,136 Z\"><\/path><path fill=\"currentColor\" d=\"M300,132 L292,128 L292,136 Z\"><\/path>\n<text font-size=\"11\" fill=\"currentColor\" y=\"146\" x=\"156\">R<\/text>\n<\/svg><\/figure>\n<\/section>\n<section class=\"card\"><h2>Worked Example — Projectile Motion<\/h2>\n<div class=\"example\"><div class=\"ex-q\">A ball is launched from the edge of a 45 m cliff at 20 m/s, 30° above horizontal. Find the time to hit the ground below, and its velocity (speed and direction) at impact.<\/div>\n<p>\\(0 = 45 + (20\\sin30^\\circ)t - \\tfrac{1}{2}(9.8)t^{2} \\;\\Longrightarrow\\; 4.9t^{2} - 10t - 45 = 0\\)<\/p>\n<p class=\"ans\">t ≈ 4.22 s<\/p>\n<p>\\(v_x = v_i\\cos\\theta = 17.3\\ \\text{m/s}\\) (unchanged)<\/p>\n<p>\\(v_y = v_i\\sin\\theta - gt = 10 - 9.8(4.22) \\approx -31.3\\ \\text{m/s}\\)<\/p>\n<p>\\(|v| = \\sqrt{17.3^{2} + 31.3^{2}}\\)<\/p>\n<p class=\"ans\">|v| ≈ 35.7 m/s<\/p>\n<p class=\"note\">Reference angle \\(\\tan^{-1}\\dfrac{31.3}{17.3} \\approx 61^\\circ\\). Since \\(v_x &gt; 0\\) and \\(v_y &lt; 0\\) the vector is in Quadrant IV: direction = 360° − 61° = 299°.<\/p><\/div>\n<\/section>\n<section class=\"card\"><h2>Trajectory Equation<\/h2>\n<p>Combines the x-path and the y-path into a single equation, y as a function of x, by eliminating t: substitute \\(t = \\dfrac{x}{v_i\\cos\\theta}\\) from x(t) into y(t).<\/p>\n<p><b>Reminder:<\/b> \\(v = \\dfrac{x}{t}\\) (constant horizontal velocity, so \\(t = \\dfrac{x}{v_x}\\))<\/p>\n<p><span class=\"key\">\\(y = x\\tan\\theta - \\dfrac{g\\,x^{2}}{2v_i^{2}\\cos^{2}\\theta}\\)<\/span><\/p>\n<p class=\"note\">Its graph is a parabola. If the launch height is not zero, add \\(y_i\\) to the front.<\/p>\n<\/section>\n<section class=\"card\"><h2>Worked Example — Combining \\(a_c\\) &amp; \\(a_t\\)<\/h2>\n<div class=\"example\"><div class=\"ex-q\">An object moves on a circle of radius 3.3 m. Its total acceleration is 12 m/s², directed 30° from the radial direction. Find \\(a_c\\), \\(a_t\\) and the speed.<\/div>\n<p>\\(a_c = |a|\\cos30^\\circ = 12(0.866) \\;\\Longrightarrow\\;\\) <b class=\"ansi\">10.39 m/s²<\/b><\/p>\n<p>\\(a_t = |a|\\sin30^\\circ = 12(0.5) \\;\\Longrightarrow\\;\\) <b class=\"ansi\">6 m/s²<\/b><\/p>\n<p>\\(v = \\sqrt{a_c r} = \\sqrt{10.39\\times3.3}\\)<\/p>\n<p class=\"ans\">v ≈ 5.86 m/s<\/p><\/div>\n<\/section>\n<\/div>\n<div class=\"stack\">\n<div class=\"side-label\">Rules<\/div>\n<div class=\"panel\"><h2>2D Motion &amp; Projectiles<\/h2>\n<p>\\(\\vec{r} = x\\hat{i} + y\\hat{j}\\)<\/p>\n<p>\\(\\vec{v}_f = \\vec{v}_i + \\vec{a}t \\;\\rightarrow\\; (v_{xi}+a_xt)\\hat{i} + (v_{yi}+a_yt)\\hat{j}\\)<\/p>\n<p>\\(|v| = \\sqrt{v_x^{2} + v_y^{2}}\\) &nbsp; \\(\\theta = \\tan^{-1}\\dfrac{v_y}{v_x}\\)<\/p>\n<p class=\"note\">Projectile: \\(a_y = -g\\), \\(v_x\\) constant, no air resistance<\/p>\n<p>\\(x(t) = x_i + v_{xi}t\\)<\/p>\n<p>\\(y(t) = y_i + v_{yi}t - \\tfrac{1}{2}gt^{2}\\)<\/p>\n<p>\\(v_{xi} = v_i\\cos\\theta\\) &nbsp; \\(v_{yi} = v_i\\sin\\theta\\)<\/p>\n<p><b>Valid only when \\(y_i = y_f\\)<\/b> <span class=\"note\">(launch and landing at the same height):<\/span><\/p>\n<p><span class=\"key\">\\(t = \\dfrac{2v_i\\sin\\theta}{g}\\)<\/span><\/p>\n<p><span class=\"key\">\\(R = \\dfrac{2v_i^{2}\\sin\\theta\\cos\\theta}{g} = \\dfrac{v_i^{2}\\sin2\\theta}{g}\\)<\/span><\/p>\n<p><span class=\"key\">\\(h = \\dfrac{v_i^{2}\\sin^{2}\\theta}{2g}\\)<\/span><\/p>\n<p class=\"note\">Maximum range at θ = 45° (sin 2θ = 1).<\/p>\n<\/div>\n<div class=\"panel\"><h2>Uniform Circular Motion<\/h2>\n<p>\\(\\theta = \\dfrac{vt}{r}\\) &nbsp; \\(\\omega = \\dfrac{v}{r}\\) &nbsp; \\(v = r\\omega\\)<\/p>\n<p><span class=\"key\">\\(T = \\dfrac{2\\pi r}{v}\\)<\/span> &nbsp; <span class=\"key\">\\(T = \\dfrac{1}{f}\\)<\/span><\/p>\n<p class=\"note\">Rate = frequency f (in Hz); T is the period.<\/p>\n<\/div>\n<div class=\"panel\"><h2>Centripetal &amp; Tangential Acceleration<\/h2>\n<p><span class=\"key\">\\(a_c = -\\dfrac{v^{2}}{r} = -\\omega^{2}r\\)<\/span><\/p>\n<p><span class=\"key\">\\(a_t = \\dfrac{\\Delta v}{\\Delta t}\\)<\/span><\/p>\n<p>\\(|a| = \\sqrt{a_c^{2} + a_t^{2}}\\) &nbsp; \\(\\theta = \\tan^{-1}\\dfrac{a_c}{a_t}\\)<\/p>\n<p class=\"note\">\\(a_c\\) points to the centre; \\(a_t\\) changes the speed. Both can be resolved into x- or y-components using θ.<\/p>\n<\/div>\n<\/div>\n<\/div>", "meta": "Chapter Review", "at": 1791537342220}, {"id": "4lz1czvmwks32nomf1ol", "label": "Chapter 5", "title": "Laws of motion", "html": "<p class=\"sub\">Force \\(|\\vec{F}|\\) · Incline angle \\(\\theta\\) · Frame of reference · \\(\\Sigma\\vec{F}\\) · Inertia &amp; mass · \\(F_g\\) vs \\(F_G\\) · Equilibrium · Free body diagram<\/p>\n<p class=\"intro\">Newton's three laws of motion, the forces acting on an object (weight and universal gravitation), equilibrium, and how to show forces in a free body diagram, all within inertial reference frames.<\/p>\n\n<div class=\"panel\"><h2>Important<\/h2>\n<div class=\"rule\">Newton's laws are only valid in a rest / inertial reference frame.<\/div>\n<\/div>\n\n<div class=\"grid g-wide-left\">\n  <section class=\"card\">\n    <h2>Worked Example — Free body diagram<\/h2>\n    <figure class=\"diagram\">\n      <svg width=\"300\" viewBox=\"0 0 300 220\">\n        <rect stroke-width=\"1.5\" stroke=\"currentColor\" class=\"hl\" height=\"40\" width=\"40\" y=\"90\" x=\"130\"><\/rect>\n        <line stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"110\" x2=\"255\" y1=\"110\" x1=\"170\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"247,104 255,110 247,116\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"100\" x=\"200\">applied<\/text>\n        <line stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"110\" x2=\"45\" y1=\"110\" x1=\"130\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"53,104 45,110 53,116\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"100\" x=\"55\">friction<\/text>\n        <line stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"200\" x2=\"150\" y1=\"130\" x1=\"150\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"144,192 150,200 156,192\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"196\" x=\"160\">weight F_g<\/text>\n        <line stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"20\" x2=\"150\" y1=\"90\" x1=\"150\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"144,28 150,20 156,28\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"32\" x=\"160\">normal force<\/text>\n      <\/svg>\n      <figcaption>Object drawn as a box with every force as an arrow from its centre<\/figcaption>\n    <\/figure>\n    <div class=\"example\">\n      <div class=\"ex-q\">Show all the forces acting on the object in a free body diagram.<\/div>\n      <ol class=\"spine\">\n        <li><span class=\"step\">Draw the object<\/span><div>A small square at the centre of the diagram.<\/div><\/li>\n        <li><span class=\"step\">Horizontal forces<\/span><div>Left: friction. Right: applied force.<\/div><\/li>\n        <li><span class=\"step\">Vertical forces<\/span><div>Down: weight \\(F_g = mg\\). Up: normal force.<\/div><\/li>\n        <li><span class=\"step\">Components<\/span><div>Split \\(\\Sigma\\vec{F}\\) into its \\(x\\) and \\(y\\) components.<\/div><\/li>\n        <li><span class=\"step\">Check equilibrium<\/span><div class=\"res\">If \\(F_{net} = 0\\), the object is in equilibrium.<\/div><\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <div class=\"stack\">\n    <div class=\"side-label\">Rules<\/div>\n    <div class=\"panel\"><h2>Newton's laws<\/h2>\n      <div class=\"part\"><h3>Law 1<\/h3>\n        <p>An object at rest remains at rest, and an object in motion remains in motion, unless acted on by a net external force.<\/p>\n      <\/div>\n      <div class=\"part\"><h3>Law 2<\/h3>\n        <div class=\"key\">\\[\\Sigma\\vec{F} = m\\vec{a}\\]<\/div>\n        <p>\\(\\vec{F}\\) has \\(x\\) and \\(y\\) components.<\/p>\n        <p>\\(F_{net} = 0\\) means equilibrium.<\/p>\n      <\/div>\n      <div class=\"part\"><h3>Law 3<\/h3>\n        <p>For every action there is an equal and opposite reaction.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"grid g2\">\n  <section class=\"card\">\n    <h2>Gravity: \\(F_g\\) vs \\(F_G\\)<\/h2>\n    <div class=\"rule\">Weight near Earth: \\[F_g = mg\\]<\/div>\n    <p class=\"note\">Always points down (with \\(y\\) and \\(x\\) components if on an inclined plane at angle \\(\\theta\\)).<\/p>\n    <div class=\"rule\">Universal gravitation: \\[F_G = \\frac{G m_1 m_2}{r^2}\\]<\/div>\n  <\/section>\n  <section class=\"card\">\n    <h2>Forces &amp; frames<\/h2>\n    <ul>\n      <li>Inertia and mass.<\/li>\n      <li>There is a difference between contact and noncontact forces.<\/li>\n      <li>Work in an inertial reference frame.<\/li>\n    <\/ul>\n    <div class=\"cells\"><span>Contact forces<\/span><span>Noncontact forces<\/span><\/div>\n  <\/section>\n<\/div>", "meta": "Chapter 5", "at": 1792393522947}, {"id": "9blgxugrdyfq7iceup8l", "label": "Chapter 6", "title": "Circular Motion", "html": "<p class=\"sub\">Centripetal Force · Vertical and Horizontal Planes · Conical Pendulum · Vertical Loop · Tension Limits<\/p>\n<p class=\"intro\">This lesson applies Newton's laws to circular motion: the centripetal force, the conical pendulum, and the tension at the top and bottom of a vertical loop.<\/p>\n\n<div class=\"grid g2\">\n  <section class=\"card\">\n    <h2>Centripetal Force<\/h2>\n    <div class=\"rule\">\\( a_r = -\\left(\\frac{v^2}{r}\\right) \\) so \\( |F| = m\\frac{v^2}{r} \\)<\/div>\n    <div class=\"key\">\\[ F_r = \\frac{mv^2}{r} \\qquad F_T = m\\frac{dv}{dt} \\]<\/div>\n    <p class=\"note\">\\(F_r\\) is the radial (centripetal) force and \\(F_T\\) is the tangential force.<\/p>\n    <div class=\"rule\">Rate \\( = \\frac{v}{2\\pi r} \\)<\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <h2>Which Component Is Centripetal?<\/h2>\n    <div class=\"cells\"><span>Vertical plane: \\( \\Sigma F_y = m a_c \\)<\/span><span>Horizontal plane: \\( \\Sigma F_x = m a_c \\)<\/span><\/div>\n    <p class=\"note\">When the rotation is in a vertical plane, \\(m a_c\\) is the \\(y\\) force. When the rotation is in a horizontal plane, \\(m a_c\\) is the \\(x\\) force.<\/p>\n    <figure class=\"diagram\">\n      <svg width=\"240\" viewBox=\"0 0 240 150\">\n        <ellipse stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" ry=\"50\" rx=\"55\" cy=\"65\" cx=\"120\"><\/ellipse>\n        <circle fill=\"currentColor\" r=\"4\" cy=\"115\" cx=\"120\"><\/circle>\n        <line stroke-width=\"1.5\" stroke=\"currentColor\" class=\"acc\" y2=\"78\" x2=\"120\" y1=\"115\" x1=\"120\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"115,84 120,78 125,84\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"90\" x=\"127\">n (or T)<\/text>\n        <line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"145\" x2=\"120\" y1=\"115\" x1=\"120\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" points=\"115,139 120,145 125,139\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"143\" x=\"127\">mg<\/text>\n      <\/svg>\n      <figcaption>Rotating on a surface: \\( \\vec{n} \\) (or T) up and mg down at the bottom point.<\/figcaption>\n    <\/figure>\n  <\/section>\n<\/div>\n\n<section class=\"card\">\n  <h2>Conical Pendulum<\/h2>\n  <div class=\"grid g2\">\n    <figure class=\"diagram\">\n      <svg width=\"280\" viewBox=\"0 0 280 200\">\n        <line stroke-dasharray=\"4 3\" stroke-width=\"1\" stroke=\"currentColor\" y2=\"185\" x2=\"100\" y1=\"15\" x1=\"100\"><\/line>\n        <line stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" y2=\"125\" x2=\"190\" y1=\"15\" x1=\"100\"><\/line>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"62\" x=\"152\">L<\/text>\n        <path stroke-width=\"1.2\" fill=\"none\" stroke=\"currentColor\" d=\"M100,40 A25,25 0 0,0 116,34\"><\/path>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"55\" x=\"104\">θ<\/text>\n        <circle fill=\"currentColor\" r=\"5\" cy=\"125\" cx=\"190\"><\/circle>\n        <line stroke-width=\"1.5\" stroke=\"currentColor\" class=\"acc\" y2=\"80\" x2=\"190\" y1=\"125\" x1=\"190\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"185,86 190,80 195,86\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"88\" x=\"196\">T cosθ<\/text>\n        <line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"175\" x2=\"190\" y1=\"125\" x1=\"190\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" points=\"185,169 190,175 195,169\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"175\" x=\"196\">mg<\/text>\n        <line stroke-width=\"1.5\" stroke=\"currentColor\" class=\"acc\" y2=\"125\" x2=\"135\" y1=\"125\" x1=\"190\"><\/line>\n        <polyline stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" points=\"141,120 135,125 141,130\"><\/polyline>\n        <text font-size=\"12\" fill=\"currentColor\" y=\"145\" x=\"104\">F_r = T sinθ<\/text>\n      <\/svg>\n      <figcaption>String of length L at angle θ from the vertical. Radius = \\( L\\sin\\theta \\).<\/figcaption>\n    <\/figure>\n    <div>\n      <div class=\"rule\">\\( \\Sigma F_x = \\) centripetal: \\( T\\sin\\theta = \\frac{mv^2}{r} \\)<\/div>\n      <div class=\"rule\">\\( \\Sigma F_y = 0 \\) (vertical): \\( T\\cos\\theta = mg \\)<\/div>\n      <p>Divide the two equations:<\/p>\n      \\[ \\tan\\theta = \\frac{v^2}{rg} \\]\n      <p>With \\( r = L\\sin\\theta \\):<\/p>\n      \\[ v = \\sqrt{L\\sin\\theta \\, g\\tan\\theta} \\]\n      <div class=\"key\">\\[ v = \\sqrt{rg\\tan\\theta} \\]<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div class=\"grid g-wide-left\">\n  <section class=\"card\">\n    <h2>Worked Example — Maximum Speed Before the String Breaks<\/h2>\n    <div class=\"example\">\n      <div class=\"ex-q\">Class q1: \\( m = 0.5 \\), length \\( = 1.5 \\) (radius), \\( F_{max} = 50 \\). Find \\( \\class{u}{v} \\).<\/div>\n      <ol class=\"spine\">\n        <li><span class=\"step\">Newton's 2nd law<\/span><div>\\( T - ma = 0 \\)<\/div><\/li>\n        <li><span class=\"step\">Tension is centripetal<\/span><div>\\( T = \\frac{mv^2}{r} \\)<\/div><\/li>\n        <li><span class=\"step\">Solve for v<\/span><div>\\( v = \\sqrt{\\frac{Tr}{m}} \\)<\/div><\/li>\n        <li><span class=\"step\">Substitute<\/span><div>\\( v = \\sqrt{\\frac{50 \\cdot 1.5}{0.5}} \\)<\/div><\/li>\n        <li><span class=\"step\">Result<\/span><div class=\"res\"><span class=\"ans\">\\( v \\approx 12.2 \\) m/s<\/span><\/div><\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <div class=\"stack\">\n    <div class=\"side-label\">Rules<\/div>\n    <div class=\"panel\">\n      <h2>Vertical Loop<\/h2>\n      <div class=\"part\">Top: \\( \\cos(180^\\circ) \\rightarrow \\)<br>\\( T_{top} = -mg + \\frac{mv^2}{r} \\)<\/div>\n      <div class=\"part\">\\( T_{bottom} = mg + \\frac{mv^2}{r} \\)<\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Speed from Tension<\/h2>\n      <div class=\"part\">Bottom:<br>\\( \\frac{v^2}{rg} = \\frac{T}{mg} - 1 \\)<br>\\( v = \\sqrt{rg\\left(\\frac{T}{mg} - 1\\right)} \\)<\/div>\n      <div class=\"part\">Top:<br>\\( \\frac{v^2}{rg} = \\frac{T}{mg} + 1 \\)<br>\\( v = \\sqrt{rg\\left(\\frac{T}{mg} + 1\\right)} \\)<\/div>\n    <\/div>\n  <\/div>\n<\/div>", "meta": "Chapter 6", "at": 1792394376176}, {"id": "3k6uzynuwjdusy17b00t", "label": "Chapter 7", "title": "Energy", "html": "<p class=\"sub\">Work · Work–Energy Theorem · Dot Product · Spring Work · Potential Energy · Conservation of Energy<\/p>\n<p class=\"intro\">This lesson defines work as a dot product and as an integral, proves the work–energy theorem, and links the work done by gravity and springs to changes in potential energy.<\/p>\n\n<div class=\"panel\"><h2>Important<\/h2>\n<ul>\n<li>Work uses the dot product, so the result is a <b>scalar<\/b>.<\/li>\n<li>\\(\\text{kJ} \\neq \\text{J}\\): check which unit is used.<\/li>\n<li>Key energies: \\(mgh\\) and \\(\\frac{1}{2}kx^2\\).<\/li>\n<li>Gravity: negative (−ve) or positive (+ve) work, so watch the sign.<\/li>\n<li>Focus on the units used.<\/li>\n<li>Split into \\(F_y\\) and \\(F_x\\) (\\(a_y\\), \\(a_x\\)).<\/li>\n<\/ul>\n<\/div>\n\n<div class=\"grid g-wide-left\">\n<div class=\"stack\">\n<section class=\"card\"><h2>Worked Example — Proof of the Work–Energy Theorem<\/h2>\n<div class=\"example\"><div class=\"ex-q\">Show that \\(F\\Delta x = \\frac{1}{2}m(v_f^2 - v_i^2)\\) for a constant force.<\/div>\n<ol class=\"spine\">\n<li><span class=\"step\">Kinematics<\/span><div>\\[v_f = v_i + at, \\quad a = \\frac{F}{m}\\]<\/div><\/li>\n<li><span class=\"step\">Time<\/span><div>\\[t = \\frac{v_f - v_i}{\\frac{F}{m}}\\]<\/div><\/li>\n<li><span class=\"step\">Displacement<\/span><div>\\[\\Delta x = v_i t + \\frac{1}{2}\\left(\\frac{F}{m}\\right)t^2\\]<\/div><\/li>\n<li><span class=\"step\">Substitute \\(t\\)<\/span><div>\\[\\frac{F}{m}\\Delta x = v_i(v_f - v_i)\\]\\[\\quad + \\frac{1}{2}(v_f^2 - 2v_fv_i + v_i^2)\\]<\/div><\/li>\n<li><span class=\"step\">Simplify<\/span><div>\\[F\\Delta x = \\frac{1}{2}m(v_f^2 - v_i^2)\\]<\/div><\/li>\n<li><span class=\"step\">Result<\/span><div><span class=\"ans\">\\(W = \\Delta KE\\)<\/span><\/div><\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<section class=\"card\"><h2>Worked Example — Work by a Constant Force<\/h2>\n<div class=\"example\"><div class=\"ex-q\">Problem 1: force 16, displacement 7.6, angle 20°.<\/div>\n<ol class=\"spine\">\n<li><span class=\"step\">Formula<\/span><div>\\[W = F\\,d\\cos\\theta\\]<\/div><\/li>\n<li><span class=\"step\">Substitute<\/span><div>\\[W = 16 \\times 7.6 \\times \\cos 20^\\circ\\]<\/div><\/li>\n<\/ol>\n<\/div>\n<p class=\"note\">Side moving upwards: use \\(\\cos 180^\\circ\\). Also \\(\\cos 90^\\circ = 0\\).<\/p>\n<\/section>\n<\/div>\n\n<div class=\"stack\">\n<div class=\"side-label\">Rules<\/div>\n<div class=\"key\">\\[W = \\Delta KE = F\\,d\\cos\\theta\\]\\[(\\text{J})\\]<\/div>\n<div class=\"panel\"><h2>Work<\/h2>\n<div class=\"rule\">\\[W = \\int_{x_i}^{x_f} F_x\\,dx\\]<\/div>\n<div class=\"rule\">\\[W = \\int \\vec{F}\\cdot d\\vec{r}\\]<\/div>\n<div class=\"rule\">\\[\\cos\\theta = \\frac{W}{|\\vec{F}|\\,|\\Delta\\vec{r}|}\\]<\/div>\n<div class=\"part\">Problem 13: \\(W = \\int (y\\,dx + x^2\\,dy)\\)<\/div>\n<\/div>\n<div class=\"panel\"><h2>Conservation<\/h2>\n<div class=\"rule\">\\[E_i = E_f\\]<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"grid g2\">\n<section class=\"card\"><h2>Work and Energy Changes<\/h2>\n<table class=\"t\">\n<tbody><tr><th>Work<\/th><th>Equals<\/th><th>Meaning<\/th><\/tr>\n<tr><td>\\(W\\)<\/td><td>\\(\\Delta K\\)<\/td><td>in motion<\/td><\/tr>\n<tr><td>\\(W_g\\)<\/td><td>\\(-\\Delta U_g\\)<\/td><td>falling<\/td><\/tr>\n<tr><td>\\(W_{ext}\\)<\/td><td>\\(+\\Delta U_g = mgh\\)<\/td><td>lifting something<\/td><\/tr>\n<tr><td>\\(W_s\\)<\/td><td>\\(-\\Delta U_s\\)<\/td><td>\\(-\\frac{1}{2}kx^2\\), pulling back<\/td><\/tr>\n<tr><td>\\(W_{ext}\\)<\/td><td>\\(+\\Delta U_s\\)<\/td><td>external<\/td><\/tr>\n<\/tbody><\/table>\n<p class=\"note\">Work done by gravity while lifting: \\(W = -mgh\\).<\/p>\n<figure class=\"diagram\"><svg width=\"160\" viewBox=\"0 0 160 120\">\n<line class=\"acc\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" y2=\"100\" x2=\"80\" y1=\"15\" x1=\"80\"><\/line>\n<polyline class=\"acc\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" points=\"73,90 80,102 87,90\"><\/polyline>\n<text font-size=\"12\" fill=\"currentColor\" y=\"22\" x=\"92\">U = +<\/text>\n<text font-size=\"12\" fill=\"currentColor\" y=\"104\" x=\"92\">U = −<\/text>\n<\/svg><figcaption>Moving down: \\(U\\) goes from + to −<\/figcaption><\/figure>\n<\/section>\n\n<section class=\"card\"><h2>Springs<\/h2>\n<div class=\"rule\">Spring force: \\(\\vec{F}_s = -kx\\,\\hat{i}\\)<\/div>\n<div class=\"rule\">Magnitude: \\(F_s = kx\\), with \\(x = L_f - L_i\\)<\/div>\n<h3>Work on a spring<\/h3>\n<div class=\"rule\">\\[W = \\frac{1}{2}kx_i^2 - \\frac{1}{2}kx_f^2\\]<\/div>\n<h3>From the integral<\/h3>\n<div class=\"rule\">\\[W_s = \\int_0^{x_{max}} (-kx\\,\\hat{i})\\cdot dx\\,\\hat{i}\\]\\[W_s = -\\frac{1}{2}kx_{max}^2\\]<\/div>\n<p class=\"note\">The dot product \\(\\hat{i}\\cdot\\hat{i}\\) leaves a scalar, so spring work is a number, not a vector.<\/p>\n<\/section>\n<\/div>", "meta": "Chapter 7", "at": 1792394719870}, {"id": "fkkfsoexhouy60c3dg58", "label": "Chapter 8", "title": "Conservation of Energy", "html": "<p class=\"sub\">Conservation of energy · Free fall speed · Work done by kinetic friction · Energy loss to drag · Force method<\/p>\n<p class=\"intro\">This lecture applies conservation of energy to objects moving up, down and along inclines, adds the energy taken by friction or drag, and recalls the force-and-kinematics alternative.<\/p>\n\n<div class=\"grid g-wide-left\">\n  <div class=\"stack\">\n    <section class=\"card\">\n      <h2>Worked Example — Object on a 20° Incline<\/h2>\n      <figure class=\"diagram\">\n        <svg width=\"300\" viewBox=\"0 0 320 140\">\n          <defs><marker orient=\"auto\" refY=\"4\" refX=\"7\" markerHeight=\"8\" markerWidth=\"8\" id=\"ah1\"><path stroke-width=\"1.2\" fill=\"none\" stroke=\"currentColor\" d=\"M0,0 L8,4 L0,8\"><\/path><\/marker><\/defs>\n          <polygon stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"hl\" points=\"40,120 300,120 40,25\"><\/polygon>\n          <path stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" d=\"M262,120 A38,38 0 0 0 264,107\"><\/path>\n          <text font-size=\"12\" fill=\"currentColor\" y=\"114\" x=\"232\">20°<\/text>\n          <line marker-end=\"url(#ah1)\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"118\" x2=\"20\" y1=\"25\" x1=\"20\"><\/line>\n          <text font-size=\"12\" fill=\"currentColor\" y=\"78\" x=\"2\">6.1<\/text>\n        <\/svg>\n        <figcaption>Incline at 20°, vertical height h = 6.1 m<\/figcaption>\n      <\/figure>\n      <div class=\"example\">\n        <div class=\"ex-q\">An object of weight 267 N starts at height 6.1 m on a 20° incline with \\( v_i = 0.457 \\) m/s. Set up the energy equation.<\/div>\n        <ol class=\"spine\">\n          <li><span class=\"step\">Given<\/span><div>\\( F = 267 \\) N, \\( m = 27.24 \\) kg, \\( h = 6.1 \\) m, \\( \\theta = 20^\\circ \\), \\( v_i = 0.457 \\) m/s<\/div><\/li>\n          <li><span class=\"step\">Weight component along the slope<\/span><div>\\( 267\\sin 20^\\circ \\)<\/div><\/li>\n          <li><span class=\"step\">Energy equation<\/span><div>\\[ \\tfrac{1}{2}mv_i^2 + mgh = \\tfrac{1}{2}mv_f^2 + f_k \\cdot d \\]\n          with \\( f_k = \\mu_k mg\\cos\\theta \\)<\/div><\/li>\n          <li><span class=\"step\">Substitute<\/span><div>\\[ \\tfrac{1}{2}(27.24)(0.457)^2 + mgh \\]\n          \\[ = \\tfrac{1}{2}(27.24)\\class{u}{v_f}^2 + \\mu_k mg\\cos 20^\\circ \\cdot d \\]<\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>Worked Example — Vertical Motion with Drag<\/h2>\n      <div class=\"example\">\n        <div class=\"ex-q\">An object of weight 5.29 N moves vertically through a distance d (so h = d), starting at 20 m/s, with a drag force of 0.265 N. Find \\( v_f \\).<\/div>\n        <ol class=\"spine\">\n          <li><span class=\"step\">Given<\/span><div>\\( m = \\frac{5.29}{9.8} \\), \\( v_i = 20 \\) m/s, \\( h = d \\), \\( F_d = 0.265 \\) N<\/div><\/li>\n          <li><span class=\"step\">Energy equation<\/span><div>\\[ \\tfrac{1}{2}mv_i^2 + mgh = \\tfrac{1}{2}mv_f^2 + 0 + F_d \\cdot d \\]<\/div><\/li>\n          <li><span class=\"step\">Substitute<\/span><div>\\[ \\tfrac{1}{2}\\left(\\frac{5.29}{9.8}\\right)20^2 + 5.29d \\]\n          \\[ = \\tfrac{1}{2}\\left(\\frac{5.29}{9.8}\\right)v_f^2 + 0.265d \\]<\/div><\/li>\n          <li><span class=\"step\">Simplify<\/span><div>\\[ 107.96 + 5.29d = 0.27v_f^2 + 0.265d \\]<\/div><\/li>\n          <li><span class=\"step\">Solve for \\( v_f \\)<\/span><div>\\[ 0.27v_f^2 = 107.96 + 5.025d \\]\n          <p class=\"res\"><span class=\"ans\">\\( \\class{u}{v_f} = \\sqrt{\\frac{107.96 + 5.025d}{0.27}} \\)<\/span><\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <div class=\"stack\">\n    <div class=\"side-label\">Rules<\/div>\n    <div class=\"panel\">\n      <h2>Conservation of Energy<\/h2>\n      <div class=\"rule\">\\( E_i = E_f \\)<\/div>\n      <div class=\"rule\">\\( KE_i + PE_i = KE_f + PE_f \\)<\/div>\n      <div class=\"rule\">\\[ \\tfrac{1}{2}mv_0^2 = \\tfrac{1}{2}mv_f^2 + mgh \\]<\/div>\n      <div class=\"part\">\n        <div class=\"rule\">\\( v_f^2 = v_i^2 - 2gh \\)<\/div>\n        <div class=\"rule\">\\( v_f = \\sqrt{v_0^2 - 2gh} \\)<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>With Friction<\/h2>\n      <div class=\"rule\">\\( KE_i + PE_i = KE_f + (-W_{friction}) \\)<\/div>\n      <div class=\"key\">\\[ \\tfrac{1}{2}mv_i^2 + mgh \\]\n      \\[ = \\tfrac{1}{2}mv_f^2 + f_k \\cdot d \\]<\/div>\n      <div class=\"rule\">\\( f_k = \\mu_k mg\\cos\\theta \\)<\/div>\n    <\/div>\n\n    <section class=\"card\">\n      <h2>Forces on an Incline<\/h2>\n      <figure class=\"diagram\">\n        <svg width=\"210\" viewBox=\"0 0 220 130\">\n          <defs><marker orient=\"auto\" refY=\"4\" refX=\"7\" markerHeight=\"8\" markerWidth=\"8\" id=\"ah2\"><path stroke-width=\"1.2\" fill=\"none\" stroke=\"currentColor\" d=\"M0,0 L8,4 L0,8\"><\/path><\/marker><\/defs>\n          <polygon stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" points=\"15,25 205,115 15,115\"><\/polygon>\n          <path stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" d=\"M175,115 A30,30 0 0 1 178,102\"><\/path>\n          <text font-size=\"12\" fill=\"currentColor\" y=\"110\" x=\"158\">θ<\/text>\n          <text font-size=\"12\" fill=\"currentColor\" y=\"48\" x=\"20\">θ<\/text>\n          <line marker-end=\"url(#ah2)\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"40\" x2=\"124\" y1=\"70\" x1=\"110\"><\/line>\n          <line marker-end=\"url(#ah2)\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"30\" x2=\"110\" y1=\"70\" x1=\"110\"><\/line>\n          <line marker-end=\"url(#ah2)\" stroke-width=\"1.5\" fill=\"none\" stroke=\"currentColor\" class=\"acc\" y2=\"89\" x2=\"150\" y1=\"70\" x1=\"110\"><\/line>\n        <\/svg>\n        <figcaption>Arrows perpendicular to the surface, vertically up and along the slope<\/figcaption>\n      <\/figure>\n    <\/section>\n\n    <div class=\"panel\">\n      <h2>Force Method<\/h2>\n      <div class=\"rule\">\\( F = ma \\)<\/div>\n      <ol>\n        <li>Get a<\/li>\n        <li>Kinematics equations<\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n<\/div>", "meta": "Lecture 10", "at": 1792758091621}], "at": 1792758091621, "by": ""}, {"id": "ngn110", "code": "NGN 110", "name": "Introduction to Engineering", "style": "creative", "sheets": [{"id": "xpwimwnkz0la9r1kae3c", "label": "Lectures 1 & 2", "title": "Engineering", "html": "<p class=\"sub\">Design process · Branches of engineering · Why study engineering<\/p>\n<p class=\"intro\">How engineers move from a need to a finished design in ten steps, and the six main branches of engineering.<\/p>\n\n<section class=\"card\">\n<h2>1 · Engineering Design Process (Sketch → Model → Build)<\/h2>\n<p>The steps are: <span class=\"hl\">I D S C C A A D S C<\/span> <span class=\"gl\">(first letter of each step, in order)<\/span><\/p>\n<figure class=\"diagram\">\n<svg width=\"700\" viewBox=\"0 0 600 196\">\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"40\" width=\"200\" y=\"8\" x=\"5\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"105\">Sketching stage<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"40\" width=\"150\" y=\"8\" x=\"235\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"310\">Model<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"40\" width=\"180\" y=\"8\" x=\"415\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"505\">Building<\/text>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"28\" x2=\"229\" y1=\"28\" x1=\"205\"><\/line>\n<polyline stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" points=\"223,23 231,28 223,33\"><\/polyline>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"28\" x2=\"409\" y1=\"28\" x1=\"385\"><\/line>\n<polyline stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" points=\"403,23 411,28 403,33\"><\/polyline>\n<g class=\"fo1\" font-size=\"14\">\n<text y=\"76\" x=\"12\">1. Identify the need<\/text>\n<text y=\"98\" x=\"12\">2. Define the problem<\/text>\n<text y=\"120\" x=\"12\">3. Search<\/text>\n<text y=\"142\" x=\"12\">4. Constraints<\/text>\n<text y=\"164\" x=\"12\">5. Criteria<\/text>\n<text y=\"186\" x=\"12\">6. Alternative solutions<\/text>\n<text y=\"76\" x=\"242\">7. Analysis<\/text>\n<text y=\"98\" x=\"242\">8. Decision<\/text>\n<text y=\"76\" x=\"422\">9. Specifications<\/text>\n<text y=\"98\" x=\"422\">10. Communication<\/text>\n<\/g>\n<\/svg>\n<figcaption>The ten steps grouped into the three stages: Sketch → Model → Build<\/figcaption>\n<\/figure>\n<\/section>\n\n<section class=\"card\">\n<h2>2 · Engineering<\/h2>\n<p class=\"def\"><dfn>Engineers<\/dfn> use scientific and mathematical knowledge to solve practical problems.<\/p>\n<p>There are 6 main branches:<\/p>\n<div class=\"cells\"><span>Industrial<\/span><span>Civil<\/span><span>Mechanical<\/span><span>Electrical<\/span><span>Chemical &amp; Biological<\/span><span>Computer Science &amp; Computer<\/span><\/div>\n<p><span class=\"hl\">Why study engineering?<\/span><\/p>\n<ul>\n<li>Understand how things work<\/li>\n<li>Career opportunities<\/li>\n<li>Challenging work<\/li>\n<li>Job satisfaction<\/li>\n<li>Financial security<\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\">\n<h2>3 · The Branches<\/h2>\n<figure class=\"diagram\">\n<svg width=\"700\" viewBox=\"0 0 600 156\">\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"10\" x=\"5\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"95\">Chemical &amp; Biological<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"10\" x=\"210\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"300\">Civil<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"10\" x=\"415\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"33\" x=\"505\">Computer<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"90\" x=\"5\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"113\" x=\"95\">Electrical<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"90\" x=\"210\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"113\" x=\"300\">Industrial<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" rx=\"4\" height=\"36\" width=\"180\" y=\"90\" x=\"415\"><\/rect>\n<text class=\"fb1\" font-size=\"14\" text-anchor=\"middle\" y=\"113\" x=\"505\">Mechanical<\/text>\n<g text-anchor=\"middle\" class=\"fo1\" font-size=\"13\">\n<text y=\"66\" x=\"95\">pharmaceuticals, materials<\/text>\n<text y=\"66\" x=\"300\">buildings, roads, bridges<\/text>\n<text y=\"66\" x=\"505\">hardware &amp; software<\/text>\n<text y=\"146\" x=\"95\">circuits to power grids<\/text>\n<text y=\"146\" x=\"300\">quality &amp; productivity<\/text>\n<text y=\"146\" x=\"505\">machines, motion, energy<\/text>\n<\/g>\n<\/svg>\n<figcaption>The six branches at a glance<\/figcaption>\n<\/figure>\n<p class=\"def\"><dfn>Chemical &amp; Biological<\/dfn> use chemistry to turn raw materials into useful products. <span class=\"gl\">e.g. pharmaceuticals, materials, environmental …<\/span><\/p>\n<p class=\"def\"><dfn>Civil<\/dfn> construction, design and development of physical structures such as buildings, roads and bridges, <span class=\"hl\">as opposed to digital construction like software<\/span>.<\/p>\n<p class=\"def\"><dfn>Computer<\/dfn> hardware and software. <span class=\"gl\">Designing computer systems and the programs that run on them<\/span><\/p>\n<p class=\"def\"><dfn>Electrical<\/dfn> electricity, electronics, power, networks … <span class=\"gl\">from circuits up to power grids<\/span><\/p>\n<p class=\"def\"><dfn>Industrial<\/dfn> optimising quality and productivity. <span class=\"gl\">Making systems and processes more efficient<\/span><\/p>\n<p class=\"def\"><dfn>Mechanical<\/dfn> mechanics and energy. <span class=\"gl\">Machines, motion, heat and engines<\/span><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>4 · The Ten Steps Explained<\/h2>\n<figure class=\"diagram\">\n<svg width=\"700\" viewBox=\"0 0 600 72\">\n<g stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\">\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"6\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"66\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"126\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"186\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"246\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"306\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"366\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"426\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"486\"><\/rect>\n<rect rx=\"4\" height=\"38\" width=\"48\" y=\"8\" x=\"546\"><\/rect>\n<line y2=\"27\" x2=\"66\" y1=\"27\" x1=\"54\"><\/line>\n<line y2=\"27\" x2=\"126\" y1=\"27\" x1=\"114\"><\/line>\n<line y2=\"27\" x2=\"186\" y1=\"27\" x1=\"174\"><\/line>\n<line y2=\"27\" x2=\"246\" y1=\"27\" x1=\"234\"><\/line>\n<line y2=\"27\" x2=\"306\" y1=\"27\" x1=\"294\"><\/line>\n<line y2=\"27\" x2=\"366\" y1=\"27\" x1=\"354\"><\/line>\n<line y2=\"27\" x2=\"426\" y1=\"27\" x1=\"414\"><\/line>\n<line y2=\"27\" x2=\"486\" y1=\"27\" x1=\"474\"><\/line>\n<line y2=\"27\" x2=\"546\" y1=\"27\" x1=\"534\"><\/line>\n<\/g>\n<g text-anchor=\"middle\" class=\"fb1\" font-size=\"14\">\n<text y=\"32\" x=\"30\">I<\/text>\n<text y=\"32\" x=\"90\">D<\/text>\n<text y=\"32\" x=\"150\">S<\/text>\n<text y=\"32\" x=\"210\">C<\/text>\n<text y=\"32\" x=\"270\">C<\/text>\n<text y=\"32\" x=\"330\">A<\/text>\n<text y=\"32\" x=\"390\">A<\/text>\n<text y=\"32\" x=\"450\">D<\/text>\n<text y=\"32\" x=\"510\">S<\/text>\n<text y=\"32\" x=\"570\">C<\/text>\n<\/g>\n<g text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">\n<text y=\"64\" x=\"30\">1<\/text>\n<text y=\"64\" x=\"90\">2<\/text>\n<text y=\"64\" x=\"150\">3<\/text>\n<text y=\"64\" x=\"210\">4<\/text>\n<text y=\"64\" x=\"270\">5<\/text>\n<text y=\"64\" x=\"330\">6<\/text>\n<text y=\"64\" x=\"390\">7<\/text>\n<text y=\"64\" x=\"450\">8<\/text>\n<text y=\"64\" x=\"510\">9<\/text>\n<text y=\"64\" x=\"570\">10<\/text>\n<\/g>\n<\/svg>\n<figcaption>I D S C C A A D S C: one box per step, in order<\/figcaption>\n<\/figure>\n<div class=\"flow\">\n<p><strong>I · Identify the need<\/strong><br>Recognising that a problem or need exists.<\/p>\n<p><strong>D · Define the problem<\/strong><br>State what needs to be accomplished.<\/p>\n<p><strong>S · Search<\/strong><br>Gather information. <span class=\"gl\">Existing designs, research, data<\/span><\/p>\n<p><strong>C · Constraints<\/strong><br>The limitations. <span class=\"gl\">e.g. budget, time, materials<\/span><\/p>\n<p><strong>C · Criteria<\/strong><br>Define all requirements. <span class=\"gl\">e.g. urgency, feasibility<\/span><\/p>\n<p><strong>A · Alternative solutions<\/strong><br>List all possible available solutions.<\/p>\n<p><strong>A · Analysis<\/strong><br>Analyse the alternative solutions against the constraints and criteria.<\/p>\n<p><strong>D · Decision<\/strong><br>Seek the best possibility and choose it.<\/p>\n<p><strong>S · Specifications<\/strong><br>Specify everything needed to build it. <span class=\"gl\">Dimensions, materials, parts<\/span><\/p>\n<p><strong>C · Communication<\/strong><br><span class=\"hl\">Sell your design<\/span>: present it to clients or management.<\/p>\n<\/div>\n<\/section>", "meta": "Lecture 1 & 2", "at": 1792161067044}, {"id": "1iwq6zq76ndp0d44tsg5", "label": "Lecture 3", "title": "Sustainability", "html": "<p class=\"sub\">Pillars of sustainability · Sustainable engineering · Traditional vs sustainable design · Sustainability in each engineering field<\/p>\n<p class=\"intro\">What sustainability means, why engineers should care, how sustainable engineering differs from traditional design, and where each engineering field applies it.<\/p>\n\n<section class=\"card\">\n<h2>Pillars of sustainability<\/h2>\n<div class=\"cells\"><span>Environmental<\/span><span>Social<\/span><span>Economic<\/span><\/div>\n<p>Industrial production issues include loss of nature, global warming, pollution and resource depletion.<\/p>\n<p><span class=\"hl\">We should care because of:<\/span><\/p>\n<ul>\n<li>Climate change <span class=\"gl\">(rising temperatures, extreme weather)<\/span><\/li>\n<li>Freshwater security<\/li>\n<li>Exposure to toxins<\/li>\n<li>Emerging diseases<\/li>\n<li>Food insecurity<\/li>\n<\/ul>\n<p>→ <span class=\"hl\">Maximizes<\/span> social benefit <span class=\"gl\">(weighing several social factors such as health, equity and community)<\/span><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Sustainable engineering<\/h2>\n<p class=\"def\"><dfn>Sustainable engineering<\/dfn> an approach that focuses on designing systems that meet the needs of the present without compromising the ability of future generations to meet theirs.<\/p>\n<p>→ <span class=\"hl\">Maximize<\/span> function, minimize cost <span class=\"gl\">(stay within budget)<\/span><\/p>\n<p>It differs from traditional engineering:<\/p>\n<table class=\"t\">\n<tbody><tr><th>Traditional<\/th><th>Sustainable<\/th><\/tr>\n<tr><td>Designs tools<\/td><td>Considers whole systems, not only tools<\/td><\/tr>\n<tr><td>Technical issues only<\/td><td>Integrates non-technical issues as well<\/td><\/tr>\n<tr><td>Solves the immediate problem<\/td><td>Solves problems for the future too<\/td><\/tr>\n<tr><td>Local or user context<\/td><td>Global context<\/td><\/tr>\n<\/tbody><\/table>\n<p>↳ Sustainable engineers design energy-efficient systems using renewable materials with minimum waste. They prioritize solutions that balance economic, environmental and social impacts.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Balancing the pillars<\/h2>\n<figure class=\"diagram\"><svg viewBox=\"0 0 700 302\" width=\"700\">\n<circle cx=\"300\" cy=\"110\" r=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"sb1\"><\/circle>\n<circle cx=\"400\" cy=\"110\" r=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"sb1\"><\/circle>\n<circle cx=\"350\" cy=\"197\" r=\"100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"sb1\"><\/circle>\n<text x=\"255\" y=\"95\" font-size=\"13\" text-anchor=\"middle\" class=\"fb1\">Environmental<\/text>\n<text x=\"445\" y=\"95\" font-size=\"13\" text-anchor=\"middle\" class=\"fb1\">Economic<\/text>\n<text x=\"350\" y=\"260\" font-size=\"13\" text-anchor=\"middle\" class=\"fb1\">Social<\/text>\n<text x=\"350\" y=\"72\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\">Viable<\/text>\n<text x=\"290\" y=\"178\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\">Bearable<\/text>\n<text x=\"410\" y=\"178\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\">Equitable<\/text>\n<text x=\"350\" y=\"143\" font-size=\"13\" text-anchor=\"middle\" class=\"fo1\">Sustainable<\/text>\n<\/svg><\/figure>\n<div class=\"cells\"><span>Environmental + Economic = <b>Viable<\/b><\/span><span>Social + Economic = <b>Equitable<\/b><\/span><span>Environmental + Social = <b>Bearable<\/b><\/span><\/div>\n<div class=\"key\">All three pillars together = <b>Sustainable<\/b><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>Sustainability across engineering fields<\/h2>\n<ul>\n<li><b>Chemical &amp; Bio:<\/b> carbon capture, biotechnology, water treatment.\n<ul>\n<li><dfn>Bioremediation<\/dfn>: <span class=\"gl\">using microorganisms to clean up contaminated water and soil<\/span><\/li>\n<li><dfn>Desalination<\/dfn>: <span class=\"gl\">purifying water by removing salt, turning seawater into freshwater<\/span><\/li>\n<\/ul><\/li>\n<li><b>Industrial:<\/b> <dfn>circular economy<\/dfn> <span class=\"gl\">(closed-loop systems where products are recycled after use)<\/span>, supply-chain sustainability.<\/li>\n<li><b>Mechanical:<\/b> energy-efficient systems, vehicles, 3D printing <span class=\"gl\">(less material waste)<\/span>.<\/li>\n<li><b>Civil &amp; Construction:<\/b> green building, sustainable urban planning, carbon-neutral construction.<\/li>\n<li><b>Computer Science &amp; Computer Engineering:<\/b> smart cyber systems, AI for sustainability, green computing, <dfn>digital twin technology<\/dfn> <span class=\"gl\">(a virtual model of a real system, used to monitor and optimize it)<\/span>.<\/li>\n<li><b>Electrical &amp; Mechatronics:<\/b> renewable energy, electronic design, electric transportation.<\/li>\n<\/ul>\n<\/section>", "meta": "Lecture 3", "at": 1792166343164}, {"id": "o77xn9341wd8ilz9bjl0", "label": "Lecture 4", "title": "Teamwork", "html": "<h2>Team structure<\/h2>\n<figure class=\"diagram\"><svg viewBox=\"0 0 700 246\" width=\"700\"><rect x=\"285\" y=\"6\" width=\"130\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"350\" y=\"25\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Sponsor<\/text><text x=\"424\" y=\"25\" text-anchor=\"start\" font-size=\"13\" class=\"fo1\">→ sets the mission &amp; vision, backs the team<\/text><path d=\"M350 34 V48 M120 48 H580 M120 48 V60 M350 48 V60 M580 48 V60\" stroke=\"currentColor\" stroke-width=\"1.3\" fill=\"none\"><\/path><rect x=\"50\" y=\"60\" width=\"140\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"120\" y=\"79\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Team leader<\/text><rect x=\"280\" y=\"60\" width=\"140\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"350\" y=\"79\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Team member<\/text><rect x=\"510\" y=\"60\" width=\"140\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"580\" y=\"79\" text-anchor=\"middle\" font-size=\"14\" fill=\"currentColor\">Team facilitator<\/text><text x=\"120\" y=\"108\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">decides what &amp; how;<\/text><text x=\"120\" y=\"123\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">directs the work<\/text><text x=\"358\" y=\"108\" text-anchor=\"start\" font-size=\"12.5\" class=\"fo1\">does the work; takes<\/text><text x=\"358\" y=\"123\" text-anchor=\"start\" font-size=\"12.5\" class=\"fo1\">turns in meeting roles<\/text><text x=\"580\" y=\"108\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">leads discussion &amp; keeps<\/text><text x=\"580\" y=\"123\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">the team focused; makes sure<\/text><text x=\"580\" y=\"138\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">everyone takes part; monitors<\/text><text x=\"580\" y=\"153\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">the decisions<\/text><path d=\"M350 88 V170 M86 170 H614 M86 170 V180 M218 170 V180 M350 170 V180 M482 170 V180 M614 170 V180\" stroke=\"currentColor\" stroke-width=\"1.3\" fill=\"none\"><\/path><rect x=\"22\" y=\"180\" width=\"128\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"86\" y=\"199\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"currentColor\">Meeting coordinator<\/text><text x=\"86\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">plans meetings,<\/text><text x=\"86\" y=\"241\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">follows up actions<\/text><rect x=\"154\" y=\"180\" width=\"128\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"218\" y=\"199\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"currentColor\">Recorder<\/text><text x=\"218\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">writes the minutes<\/text><text x=\"218\" y=\"241\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">&amp; action list<\/text><rect x=\"286\" y=\"180\" width=\"128\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"350\" y=\"199\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"currentColor\">Time keeper<\/text><text x=\"350\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">keeps the meeting<\/text><text x=\"350\" y=\"241\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">on time<\/text><rect x=\"418\" y=\"180\" width=\"128\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"482\" y=\"199\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"currentColor\">Encourager<\/text><text x=\"482\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">draws everyone in,<\/text><text x=\"482\" y=\"241\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">encourages ideas<\/text><rect x=\"550\" y=\"180\" width=\"128\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><text x=\"614\" y=\"199\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"currentColor\">Devil's advocate<\/text><text x=\"614\" y=\"226\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">argues the opposite<\/text><text x=\"614\" y=\"241\" text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\">to test ideas<\/text><\/svg><\/figure>\n<p class=\"def\"><dfn>Code of cooperation (ethics)<\/dfn> a shared set of ethics and rules that all members agree to and enforce, kept visible to everyone at all times.<\/p>\n<p class=\"def\"><dfn>Meeting minutes<\/dfn> the written record of a meeting: who attended, what was discussed and decided, and the action list <mark class=\"unclear\" data-n=\"3\">…<\/mark><\/p>\n\n<h2>Team dynamics<\/h2>\n<figure class=\"diagram\"><svg viewBox=\"0 0 700 74\" width=\"700\"><path d=\"M14 70 H690\" stroke=\"currentColor\" stroke-width=\"1\" fill=\"none\" opacity=\".5\"><\/path><path d=\"M14 47 C50 42 66 42 88 44 S220 64 263 61 S386 37 438 33 S568 16 613 14 S676 11 690 11\" class=\"sb1\" stroke-width=\"2\" fill=\"none\"><\/path><circle cx=\"88\" cy=\"44\" r=\"4.5\" class=\"fb1\"><\/circle><circle cx=\"263\" cy=\"61\" r=\"4.5\" class=\"fb1\"><\/circle><circle cx=\"438\" cy=\"33\" r=\"4.5\" class=\"fb1\"><\/circle><circle cx=\"613\" cy=\"14\" r=\"4.5\" class=\"fb1\"><\/circle><text x=\"14\" y=\"14\" text-anchor=\"start\" font-size=\"12\" fill=\"currentColor\" opacity=\".6\">team performance<\/text><\/svg><\/figure>\n<div class=\"flow\">\n  <div><b>Forming<\/b>members start as individuals: polite, unsure, relying on the leader<\/div>\n  <div><b>Storming<\/b>conflict: members disagree and push back<\/div>\n  <div><b>Norming<\/b>consensus grows; the team agrees its rules (leader's help)<\/div>\n  <div><b>Performing<\/b>clear strategy; the team works thoroughly on its own<\/div>\n<\/div>\n<p class=\"note\">Tuckman later added a fifth stage, <b>Adjourning<\/b>: the work ends and the team disbands.<\/p>\n\n<h2>Decision making methods<\/h2>\n<ol class=\"rank\">\n  <li>By authority without discussion <span class=\"gl\">— the leader decides alone<\/span> <span class=\"hl\">(Worst)<\/span><\/li>\n  <li>By authority after discussion <span class=\"gl\">— the leader decides after hearing the team<\/span><\/li>\n  <li>Expert member <span class=\"gl\">— the most knowledgeable member decides<\/span><\/li>\n  <li>Average of members' opinions <span class=\"gl\">— members are polled one by one, the most common view wins<\/span><\/li>\n  <li>Minority control <span class=\"gl\">— a few members decide for the team<\/span><\/li>\n  <li>Majority control <span class=\"gl\">— a vote, more than half wins<\/span><\/li>\n  <li>Consensus <span class=\"gl\">— discuss until everyone can support the decision<\/span> <span class=\"hl\">(Best)<\/span><\/li>\n<\/ol>\n\n<div class=\"unclear-list\"><b>Check these: corrections and unclear spots<\/b>\n<ol>\n  <li>Corrected: \"monitoring agenda\" was under team member; that is the coordinator's and time keeper's job.<\/li>\n  <li>Added: role duties, method meanings, meeting minutes, Adjourning. Dropped the crossed-out \"(in the team)\".<\/li>\n  <li>The notes trail off after \"Meeting minutes …\"; the lecture may list more team tools.<\/li>\n<\/ol>\n<\/div>", "meta": "Lecture 4", "at": 1791913503374}, {"id": "d91d1dqvmtcj30ef1q12", "label": "Lecture 5", "title": "Emotional Intelligence", "html": "<p class=\"sub\">Emotional Intelligence · Five competencies · Self vs social · EQ · 360 feedback<\/p>\n<p class=\"intro\">What emotional intelligence is, its five competencies, how the self and social sides differ, and how EI is measured.<\/p>\n\n<h2>Emotional Intelligence<\/h2>\n<p class=\"def\"><dfn>Emotional Intelligence (EI)<\/dfn> the ability to understand and manage your own emotions, and to recognize and influence the emotions of those around you.<\/p>\n\n<h2>Competencies<\/h2>\n<p>The five competencies, based on Goleman's model:<\/p>\n<ul>\n<li><span class=\"hl\">Self-awareness<\/span> <span class=\"gl\">(Awareness): recognizing your internal feelings and how they affect you.<\/span><\/li>\n<li><span class=\"hl\">Self-regulation<\/span> <span class=\"gl\">(Regulatory): handling emotions in a way that is appropriate to the situation.<\/span><\/li>\n<li><span class=\"hl\">Motivation<\/span> <span class=\"gl\">: channelling emotions towards a goal.<\/span><\/li>\n<li><span class=\"hl\">Empathy<\/span> <span class=\"gl\">(social awareness): understanding the emotional perspectives of other people.<\/span><\/li>\n<li><span class=\"hl\">Social skills<\/span> <span class=\"gl\">: using information about yourself and others to handle relationships.<\/span><\/li>\n<\/ul>\n\n<h2>Self vs Social: the differences<\/h2>\n<figure class=\"diagram\">\n<svg width=\"700\" viewBox=\"0 0 700 315\">\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"22\" x=\"265\">SELF (about you)<\/text>\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"22\" x=\"535\">SOCIAL (about others)<\/text>\n<text class=\"fb1\" font-size=\"14\" y=\"90\" x=\"10\">Awareness<\/text>\n<text class=\"fo1\" font-size=\"14\" y=\"108\" x=\"10\">(recognize)<\/text>\n<text class=\"fb1\" font-size=\"14\" y=\"235\" x=\"10\">Management<\/text>\n<text class=\"fo1\" font-size=\"14\" y=\"253\" x=\"10\">(act on it)<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"125\" width=\"250\" y=\"35\" x=\"140\"><\/rect>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"125\" width=\"250\" y=\"35\" x=\"410\"><\/rect>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"130\" width=\"250\" y=\"175\" x=\"140\"><\/rect>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"130\" width=\"250\" y=\"175\" x=\"410\"><\/rect>\n<text text-anchor=\"middle\" fill=\"currentColor\" font-size=\"14\" y=\"72\" x=\"265\">Self-awareness<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"98\" x=\"265\">recognizing internal feelings<\/text>\n<text text-anchor=\"middle\" fill=\"currentColor\" font-size=\"14\" y=\"72\" x=\"535\">Social awareness (Empathy)<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"98\" x=\"535\">understanding others' emotional<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"116\" x=\"535\">perspectives<\/text>\n<text text-anchor=\"middle\" fill=\"currentColor\" font-size=\"14\" y=\"205\" x=\"265\">Self-management<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"230\" x=\"265\">Self-regulation: emotions that<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"248\" x=\"265\">fit the situation<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"272\" x=\"265\">Motivation: channel emotions<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"290\" x=\"265\">towards a goal<\/text>\n<text text-anchor=\"middle\" fill=\"currentColor\" font-size=\"14\" y=\"205\" x=\"535\">Social skills<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"230\" x=\"535\">use information about you<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"248\" x=\"535\">and others to handle<\/text>\n<text text-anchor=\"middle\" class=\"fo1\" font-size=\"14\" y=\"266\" x=\"535\">relationships<\/text>\n<\/svg>\n<figcaption>Columns: who it is about. Rows: noticing versus acting.<\/figcaption>\n<\/figure>\n<p class=\"note\">Awareness comes first. You cannot manage an emotion you have not recognized, in yourself or in others.<\/p>\n\n<h2>EQ<\/h2>\n<div class=\"key\"><p class=\"def\"><dfn>EQ<\/dfn> a <span class=\"hl\">measurable<\/span> score of EI, which is the capacity to identify and manage your own emotions and those of others.<\/p><\/div>\n<p class=\"note\">EQ is to EI what IQ is to general intelligence. It is a number taken from tests or ratings, while EI is the ability itself.<\/p>\n\n<h2>360 Feedback<\/h2>\n<p class=\"def\"><dfn>360 feedback<\/dfn> multi-rater feedback. You rate yourself, and the people around you (your manager, peers, direct reports, and sometimes customers) rate you on the same competencies.<\/p>\n<figure class=\"diagram\">\n<svg width=\"700\" viewBox=\"0 0 700 150\">\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"40\" width=\"140\" y=\"55\" x=\"280\"><\/rect>\n<text text-anchor=\"middle\" fill=\"currentColor\" font-size=\"14\" y=\"80\" x=\"350\">You (self-rating)<\/text>\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"20\" x=\"350\">Manager<\/text>\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"80\" x=\"120\">Peers<\/text>\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"80\" x=\"580\">Direct reports<\/text>\n<text text-anchor=\"middle\" class=\"fb1\" font-size=\"14\" y=\"142\" x=\"350\">Customers / others<\/text>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"55\" x2=\"350\" y1=\"27\" x1=\"350\"><\/line>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"75\" x2=\"280\" y1=\"75\" x1=\"150\"><\/line>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"75\" x2=\"525\" y1=\"75\" x1=\"420\"><\/line>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"127\" x2=\"350\" y1=\"95\" x1=\"350\"><\/line>\n<\/svg>\n<figcaption>Feedback comes from all around you, a full 360°.<\/figcaption>\n<\/figure>\n<ul>\n<li>Compare your self-rating with how others rate you. <span class=\"gl\">The gaps show your <span class=\"hl\">blind spots<\/span>.<\/span><\/li>\n<li>It is commonly used to measure EI competencies, especially the social side, which others can see better than you can.<\/li>\n<\/ul>", "meta": "Lecture 5", "at": 1792166479109}, {"id": "vq3t1pxe9dcwkng37txg", "label": "Lecture 6", "title": "Documentation", "html": "<p class=\"sub\">Communication · Planning · Referencing · Reports · Visuals · Tips<\/p>\n<p class=\"intro\">Planning, citing, structuring reports, using visuals, and writing clearly.<\/p>\n\n<div class=\"panel\"><h2>Important<\/h2>\n<p><span class=\"hl\">Referencing:<\/span> cite <span class=\"hl\">in the body<\/span> as [1]; list full entries at the end, <span class=\"hl\">in order of first citation<\/span>.<\/p>\n<\/div>\n\n<section class=\"card\">\n<h2>Forms of communication<\/h2>\n<p>Communication can be <b>oral<\/b>, <dfn>written<\/dfn>, or <b>graphical<\/b>.<\/p>\n<figure class=\"diagram\"><svg viewBox=\"0 0 700 190\" width=\"700\">\n<rect x=\"280\" y=\"5\" width=\"140\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"350\" y=\"25\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Communication<\/text>\n<line x1=\"330\" y1=\"35\" x2=\"95\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/line>\n<line x1=\"350\" y1=\"35\" x2=\"350\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/line>\n<line x1=\"370\" y1=\"35\" x2=\"605\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/line>\n<rect x=\"40\" y=\"55\" width=\"110\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"95\" y=\"75\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Oral<\/text>\n<text x=\"95\" y=\"102\" text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">talks, meetings<\/text>\n<rect x=\"295\" y=\"55\" width=\"110\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"350\" y=\"75\" text-anchor=\"middle\" class=\"fb1\" font-size=\"13.5\">Written<\/text>\n<rect x=\"550\" y=\"55\" width=\"110\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"605\" y=\"75\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Graphical<\/text>\n<text x=\"605\" y=\"102\" text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">drawings, charts<\/text>\n<path d=\"M330 85 Q240 95 228 121\" fill=\"none\" class=\"sb1\" stroke-width=\"1.5\"><\/path>\n<path d=\"M223 115 L228 124 L233 115\" fill=\"none\" class=\"sb1\" stroke-width=\"1.5\"><\/path>\n<path d=\"M370 85 Q460 95 472 121\" fill=\"none\" class=\"sb1\" stroke-width=\"1.5\"><\/path>\n<path d=\"M467 115 L472 124 L477 115\" fill=\"none\" class=\"sb1\" stroke-width=\"1.5\"><\/path>\n<rect x=\"150\" y=\"125\" width=\"150\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"225\" y=\"145\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Progress report<\/text>\n<text x=\"225\" y=\"174\" text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">intro · status · conclusion<\/text>\n<rect x=\"400\" y=\"125\" width=\"150\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"475\" y=\"145\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Standard report<\/text>\n<text x=\"475\" y=\"174\" text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">full formal structure<\/text>\n<line x1=\"550\" y1=\"140\" x2=\"586\" y2=\"140\" class=\"so1\" stroke-width=\"1.5\"><\/line>\n<path d=\"M580 135 L588 140 L580 145\" fill=\"none\" class=\"so1\" stroke-width=\"1.5\"><\/path>\n<rect x=\"590\" y=\"125\" width=\"100\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/rect>\n<text x=\"640\" y=\"145\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"13.5\">Visuals<\/text>\n<text x=\"640\" y=\"174\" text-anchor=\"middle\" class=\"fo1\" font-size=\"12.5\">with guidelines<\/text>\n<\/svg><figcaption>Written communication leads to the two report types; reports use visuals.<\/figcaption><\/figure>\n<\/section>\n\n<section class=\"card\">\n<h2>Planning a document<\/h2>\n<div class=\"flow\">\n<div><h3>① Determine the reason<\/h3><p class=\"gl\">Inform, report, persuade, or record?<\/p><\/div>\n<div><h3>② Level of the reader<\/h3><p class=\"gl\">Match detail and terms to the reader.<\/p><\/div>\n<div><h3>③ Is it clear &amp; easy to understand?<\/h3><p class=\"gl\"><span class=\"hl\">Citation → in the body<\/span>.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>Reports<\/h2>\n<p class=\"def\"><dfn>Progress report<\/dfn> <b>intro<\/b>, <b>status<\/b>, <b>conclusion<\/b>.<\/p>\n<p class=\"def\"><dfn>Standard <span class=\"hl\">report<\/span><\/dfn> in this order:<\/p>\n<ol>\n<li>Cover / title page<\/li>\n<li>Abstract <span class=\"gl\">(short summary)<\/span><\/li>\n<li>Table of contents<\/li>\n<li><span class=\"fb1\">List of figures<\/span><\/li>\n<li><span class=\"fb1\">List of tables<\/span><\/li>\n<li><span class=\"fb1\">Introduction<\/span><\/li>\n<li><span class=\"fb1\">Body<\/span><\/li>\n<li><span class=\"fb1\">Conclusions<\/span><\/li>\n<li>References<\/li>\n<li><span class=\"fb1\">Appendices<\/span><\/li>\n<\/ol>\n<\/section>\n\n<section class=\"card\">\n<h2>Visuals<\/h2>\n<p><span class=\"hl\">There are visuals (with their guidelines):<\/span> number and caption each, refer to it in the text, cite its source.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Tips<\/h2>\n<ul>\n<li>Get to the point.<\/li>\n<li>Distinguish between facts and opinions.<\/li>\n<li>Express yourself clearly.<\/li>\n<li>Be specific.<\/li>\n<li>Use active, not passive, words.<\/li>\n<li>Be coherent.<\/li>\n<li>Appearance matters.<\/li>\n<\/ul>\n<\/section>", "meta": "Lecture 6", "at": 1792161882399}, {"id": "yije7pvtsf5vz0q9wgkv", "label": "Lecture 7", "title": "Systems and Critical Thinking", "html": "<p class=\"sub\">Systems · Systems thinking · Reductionism · Iceberg model · Critical thinking · Cubing<\/p>\n<p class=\"intro\">What makes something a system, how systems thinking differs from reductionism, and how cubing supports critical thinking.<\/p>\n\n<section class=\"card\">\n<h2>Systems &amp; Critical Thinking<\/h2>\n<p class=\"def\"><dfn>System<\/dfn> a set of interconnected parts that interact with and affect each other.<\/p>\n<p class=\"def\"><dfn>Collection<\/dfn> components that are not necessarily connected. Not a system.<\/p>\n<p class=\"def\"><dfn>Systems thinking<\/dfn> a mindset: seeing how all parts contribute and react to the same thing.<\/p>\n\n<figure class=\"diagram\">\n<svg viewBox=\"0 0 700 170\" width=\"700\">\n<text x=\"150\" y=\"18\" font-size=\"13.5\" text-anchor=\"middle\" class=\"fb1\">Collection<\/text>\n<circle cx=\"70\" cy=\"70\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"160\" cy=\"55\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"230\" cy=\"100\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"110\" cy=\"125\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<text x=\"150\" y=\"160\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fo1\">parts, no connections<\/text>\n<line x1=\"350\" y1=\"10\" x2=\"350\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"><\/line>\n<text x=\"530\" y=\"18\" font-size=\"13.5\" text-anchor=\"middle\" class=\"fb1\">System<\/text>\n<rect x=\"400\" y=\"30\" width=\"260\" height=\"110\" rx=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\" class=\"sb1\"><\/rect>\n<circle cx=\"450\" cy=\"65\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"560\" cy=\"55\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"610\" cy=\"110\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<circle cx=\"490\" cy=\"115\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/circle>\n<line x1=\"462\" y1=\"63\" x2=\"548\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"568\" y1=\"65\" x2=\"603\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"598\" y1=\"111\" x2=\"502\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"483\" y1=\"104\" x2=\"456\" y2=\"76\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"460\" y1=\"72\" x2=\"600\" y2=\"104\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<text x=\"672\" y=\"40\" font-size=\"12.5\" class=\"fo1\">boundary<\/text>\n<text x=\"530\" y=\"160\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fo1\">connected parts that affect each other<\/text>\n<\/svg>\n<figcaption>A collection compared with a system<\/figcaption>\n<\/figure>\n\n<p><span class=\"hl\">Characteristics<\/span> of a system:<\/p>\n<ul>\n<li><dfn>Boundaries<\/dfn>: <span class=\"gl\">what is inside vs. the environment.<\/span><\/li>\n<li><dfn>Feedback loops<\/dfn>: <span class=\"gl\">outputs loop back to change inputs (reinforcing or balancing).<\/span><\/li>\n<li><dfn>Interdependence<\/dfn>: <span class=\"gl\">changing one part affects the others.<\/span><\/li>\n<li><dfn>Emergence<\/dfn>: <span class=\"gl\">the whole does what no single part can.<\/span><\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\">\n<h2>Before systems thinking<\/h2>\n<p class=\"def\"><dfn>Reductionism<\/dfn> <span class=\"hl\">the traditional approach<\/span>: studies parts separately and treats the whole as just their sum.<\/p>\n\n<figure class=\"diagram\">\n<svg viewBox=\"0 0 700 260\" width=\"700\">\n<polygon points=\"200,10 20,250 380,250\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/polygon>\n<line x1=\"155\" y1=\"70\" x2=\"245\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"110\" y1=\"130\" x2=\"290\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<line x1=\"65\" y1=\"190\" x2=\"335\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/line>\n<text x=\"200\" y=\"55\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fb1\">Events<\/text>\n<text x=\"200\" y=\"105\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fb1\">Patterns of behaviour<\/text>\n<text x=\"200\" y=\"165\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fb1\">Underlying structure<\/text>\n<text x=\"200\" y=\"225\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fb1\">Mental models<\/text>\n<line x1=\"410\" y1=\"40\" x2=\"410\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"sb1\"><\/line>\n<polyline points=\"404,222 410,232 416,222\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"sb1\"><\/polyline>\n<text x=\"430\" y=\"55\" font-size=\"12.5\" class=\"fo1\">what happened<\/text>\n<text x=\"430\" y=\"105\" font-size=\"12.5\" class=\"fo1\">repeating trends<\/text>\n<text x=\"430\" y=\"165\" font-size=\"12.5\" class=\"fo1\">rules and links causing patterns<\/text>\n<text x=\"430\" y=\"225\" font-size=\"12.5\" class=\"fo1\">beliefs and assumptions<\/text>\n<\/svg>\n<figcaption>Deeper layers: harder to see, more power to change<\/figcaption>\n<\/figure>\n<\/section>\n\n<section class=\"card\">\n<h2>Critical thinking<\/h2>\n<p><dfn>Critical thinking<\/dfn> helps you:<\/p>\n<div class=\"cells\"><span>make decisions<\/span><span>solve problems<\/span><span>refine research skills<\/span><span>polish creativity<\/span><span>stimulate curiosity<\/span><\/div>\n\n<p><dfn>Cubing<\/dfn>: six methods for looking at a topic.<\/p>\n<ol>\n<li><dfn>Describe<\/dfn>: <span class=\"gl\">what is it?<\/span><\/li>\n<li><dfn>Compare<\/dfn>: <span class=\"gl\">similar to or different from what?<\/span><\/li>\n<li><dfn>Associate<\/dfn>: <span class=\"gl\">what does it connect to?<\/span><\/li>\n<li><dfn>Analyze<\/dfn>: <span class=\"gl\">its parts and how it works.<\/span><\/li>\n<li><dfn>Apply<\/dfn>: <span class=\"gl\">how can it be used?<\/span><\/li>\n<li><dfn>Argue<\/dfn>: <span class=\"gl\">for or against, with reasons.<\/span><\/li>\n<\/ol>\n<\/section>", "meta": "Lecture 7", "at": 1792162240330}, {"id": "s7wqttn1fm309zunl0rq", "label": "Recitation 3", "title": "Sketching, drawing, and 3D printing", "html": "<p class=\"sub\">Engineering stages · Types of drawings · Line types · Projection · 3D printing<\/p>\n<p class=\"intro\">How an idea moves from the mind to paper to a physical part: the stages of engineering drawing, the main drawing types and line conventions, and the three common 3D printing methods.<\/p>\n\n<section class=\"card\">\n<h2>Engineering stages<\/h2>\n<div class=\"flow\">\n<div><strong>Visualization<\/strong><br><span class=\"gl\">Picture the object or idea in your mind first.<\/span><\/div>\n<div><strong>Sketching<\/strong><br><span class=\"gl\">Quick freehand drawings to explore and share ideas.<\/span><\/div>\n<div><strong>Detailed Drawings<\/strong><br><span class=\"gl\">Precise, dimensioned drawings: a graphical way of transferring information. They are important because they are easier to interpret.<\/span><\/div>\n<div><strong>3D Models<\/strong><br><span class=\"gl\">CAD models that can be viewed, analysed and sent to a printer.<\/span><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>Types of drawings<\/h2>\n<p><span class=\"hl\">Types are Orthographic, Isometric and Section Views<\/span><\/p>\n<p class=\"def\"><dfn>Orthographic<\/dfn> shows a multi-dimensional object as several 2D views: front, top and right side.<\/p>\n<p class=\"def\"><dfn>Isometric<\/dfn> shows 3D structures in one view, with length, width and height drawn on axes 120° apart.<\/p>\n<p class=\"def\"><dfn>Section views<\/dfn> show internal components by imaginary slicing through the object. The cut surface is hatched.<\/p>\n<p><span class=\"hl\">Keep in mind proportions.<\/span><\/p>\n<figure class=\"diagram\"><svg width=\"700\" viewBox=\"0 0 700 60\">\n<line stroke-width=\"2.5\" stroke=\"currentColor\" y2=\"25\" x2=\"200\" y1=\"25\" x1=\"20\"><\/line>\n<text font-size=\"13\" fill=\"currentColor\" y=\"50\" x=\"20\">Visible: solid, thick<\/text>\n<line stroke-dasharray=\"8 5\" stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"25\" x2=\"440\" y1=\"25\" x1=\"260\"><\/line>\n<text font-size=\"13\" fill=\"currentColor\" y=\"50\" x=\"260\">Hidden: dashed<\/text>\n<line stroke-dasharray=\"16 4 3 4\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"25\" x2=\"680\" y1=\"25\" x1=\"500\"><\/line>\n<text font-size=\"13\" fill=\"currentColor\" y=\"50\" x=\"500\">Center: long–short chain<\/text>\n<\/svg><figcaption>Line types: visible, hidden and center lines.<\/figcaption><\/figure>\n<\/section>\n\n<section class=\"card\">\n<h2>Projection<\/h2>\n<p class=\"def\"><dfn>Projection<\/dfn> a 2D representation of a 3D object. Each view shows 2 out of the 3 dimensions (width, depth and height).<\/p>\n<ul>\n<li>Dashed lines represent hidden lines that are not visible from that angle.<\/li>\n<li>The 3 views are usually on the same figure.<\/li>\n<\/ul>\n<figure class=\"diagram\"><svg width=\"700\" viewBox=\"0 0 700 215\">\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"60\" width=\"140\" y=\"10\" x=\"200\"><\/rect>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"70\" x2=\"270\" y1=\"10\" x1=\"270\"><\/line>\n<circle stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" r=\"12\" cy=\"40\" cx=\"235\"><\/circle>\n<line stroke-dasharray=\"8 3 2 3\" stroke-width=\"0.8\" stroke=\"currentColor\" y2=\"40\" x2=\"252\" y1=\"40\" x1=\"218\"><\/line>\n<line stroke-dasharray=\"8 3 2 3\" stroke-width=\"0.8\" stroke=\"currentColor\" y2=\"57\" x2=\"235\" y1=\"23\" x1=\"235\"><\/line>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fb1\" y=\"88\" x=\"270\">TOP<\/text>\n<path stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" d=\"M200,100 L270,100 L270,140 L340,140 L340,180 L200,180 Z\"><\/path>\n<line stroke-dasharray=\"6 4\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"140\" x2=\"223\" y1=\"100\" x1=\"223\"><\/line>\n<line stroke-dasharray=\"6 4\" stroke-width=\"1.2\" stroke=\"current
