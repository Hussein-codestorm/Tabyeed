Color\" y2=\"140\" x2=\"247\" y1=\"100\" x1=\"247\"><\/line>\n<line stroke-dasharray=\"6 4\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"140\" x2=\"247\" y1=\"140\" x1=\"223\"><\/line>\n<line stroke-dasharray=\"8 3 2 3\" stroke-width=\"0.8\" stroke=\"currentColor\" y2=\"146\" x2=\"235\" y1=\"94\" x1=\"235\"><\/line>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fb1\" y=\"200\" x=\"270\">FRONT<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"80\" width=\"70\" y=\"100\" x=\"380\"><\/rect>\n<line stroke-width=\"1.5\" stroke=\"currentColor\" y2=\"140\" x2=\"450\" y1=\"140\" x1=\"380\"><\/line>\n<line stroke-dasharray=\"6 4\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"140\" x2=\"398\" y1=\"100\" x1=\"398\"><\/line>\n<line stroke-dasharray=\"6 4\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"140\" x2=\"422\" y1=\"100\" x1=\"422\"><\/line>\n<line stroke-dasharray=\"8 3 2 3\" stroke-width=\"0.8\" stroke=\"currentColor\" y2=\"146\" x2=\"410\" y1=\"94\" x1=\"410\"><\/line>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fb1\" y=\"200\" x=\"415\">RIGHT SIDE<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"110\" x=\"10\">each view = 2 of 3 dimensions<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"130\" x=\"10\">front → width × height<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"148\" x=\"10\">top → width × depth<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"166\" x=\"10\">side → depth × height<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"115\" x=\"480\">dashed = hole hidden inside<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"135\" x=\"480\">chain = centre line of hole<\/text>\n<text font-size=\"12.5\" class=\"fo1\" y=\"155\" x=\"480\">circle seen only from the top<\/text>\n<\/svg><figcaption>Three orthographic views of a stepped block with a drilled hole, on one figure.<\/figcaption><\/figure>\n<\/section>\n\n<section class=\"card\">\n<h2>3D printing technology<\/h2>\n<p>3D printing <span class=\"hl\">(digital → physical model)<\/span> builds a part layer by layer from a digital file.<\/p>\n<figure class=\"diagram\"><svg width=\"700\" viewBox=\"0 0 700 150\">\n<defs><marker orient=\"auto\" refY=\"4\" refX=\"7\" markerHeight=\"8\" markerWidth=\"8\" id=\"ah\"><path stroke-width=\"1.2\" stroke=\"currentColor\" fill=\"none\" d=\"M0,0 L8,4 L0,8\"><\/path><\/marker><\/defs>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"30\" width=\"190\" y=\"5\" x=\"255\"><\/rect>\n<text text-anchor=\"middle\" font-size=\"13.5\" fill=\"currentColor\" y=\"25\" x=\"350\">3D printing technology<\/text>\n<line marker-end=\"url(#ah)\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"68\" x2=\"130\" y1=\"35\" x1=\"350\"><\/line>\n<line marker-end=\"url(#ah)\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"68\" x2=\"350\" y1=\"35\" x1=\"350\"><\/line>\n<line marker-end=\"url(#ah)\" stroke-width=\"1.2\" stroke=\"currentColor\" y2=\"68\" x2=\"570\" y1=\"35\" x1=\"350\"><\/line>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"28\" width=\"190\" y=\"70\" x=\"30\"><\/rect>\n<text text-anchor=\"middle\" font-size=\"13.5\" class=\"fb1\" y=\"89\" x=\"125\">FDM<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"28\" width=\"190\" y=\"70\" x=\"255\"><\/rect>\n<text text-anchor=\"middle\" font-size=\"13.5\" class=\"fb1\" y=\"89\" x=\"350\">SLS<\/text>\n<rect stroke-width=\"1.5\" stroke=\"currentColor\" fill=\"none\" height=\"28\" width=\"190\" y=\"70\" x=\"480\"><\/rect>\n<text text-anchor=\"middle\" font-size=\"13.5\" class=\"fb1\" y=\"89\" x=\"575\">Stereolithography<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"118\" x=\"125\">melts &amp; extrudes filament<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"136\" x=\"125\">easy, cost-effective<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"118\" x=\"350\">laser sinters powder<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"136\" x=\"350\">high detail, small parts<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"118\" x=\"575\">UV light cures resin<\/text>\n<text text-anchor=\"middle\" font-size=\"12.5\" class=\"fo1\" y=\"136\" x=\"575\">smooth, fine detail<\/text>\n<\/svg><figcaption>The three main 3D printing methods.<\/figcaption><\/figure>\n<p class=\"def\"><dfn>Fused Deposition Modeling (FDM)<\/dfn> uses thermal extrusion. It melts thermoplastic filament and extrudes it layer by layer. It is a flexible, easy and cost-effective way to create functional parts.<\/p>\n<p class=\"def\"><dfn>Selective Laser Sintering (SLS)<\/dfn> uses a laser to sinter (fuse) powdered plastic or metal layer by layer. It gives high detail and is good for small components.<\/p>\n<p class=\"def\"><dfn>Stereolithography (SLA)<\/dfn> uses ultraviolet light to cure liquid resin into solid layers, one layer at a time.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Applications &amp; materials<\/h2>\n<p><span class=\"hl\">Applications:<\/span> prototyping, manufacturing, medical, architecture and large-scale applications.<\/p>\n<p><span class=\"hl\">Materials<\/span> → plastics, composites, metals.<\/p>\n<p><strong>SolidWorks, Tinkercad<\/strong> <span class=\"gl\">: CAD software used to build the 3D model before printing.<\/span><\/p>\n<\/section>", "meta": "Recitation 3", "at": 1792166735987}], "at": 1792166735987, "by": ""}];
const $=s=>document.querySelector(s);

/* Page theme */
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
applyTheme(store.get('tn-theme'));
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
$('#themeBtn').onclick=()=>{const t=isDark()?'light':'dark';applyTheme(t);store.set('tn-theme',t);if(cur)render()};

/* Favourite courses, kept on this device */
let favs=[];try{favs=JSON.parse(store.get('tn-favs')||'[]')}catch(e){}
const isFav=id=>favs.includes(id);
function toggleFav(id){favs=isFav(id)?favs.filter(x=>x!==id):[...favs,id];store.set('tn-favs',JSON.stringify(favs))}
const starBtn=c=>`<button class="star" type="button" data-fav="${c.id}" aria-pressed="${isFav(c.id)}" aria-label="${isFav(c.id)?'Remove from':'Add to'} favourites: ${esc(c.code)}" title="${isFav(c.id)?'Remove from favourites':'Add to favourites'}">${STAR}</button>`;
function wireStars(after){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.preventDefault();toggleFav(b.dataset.fav);after()})}

  const total=DATA.reduce((n,c)=>n+c.sheets.length,0);
  const card=c=>`<div class="course"><a href="#/${c.id}"><span class="code">${esc(c.code)}</span><span class="nm">${esc(c.name)}</span><span class="m">${c.sheets.length} sheets${c.by?` · by ${esc(c.by)}`:''}</span><span class="m">Updated ${fmtDate(c.at)}</span></a>${starBtn(c)}</div>`;
  const fav=DATA.filter(c=>isFav(c.id)),rest=DATA.filter(c=>!isFav(c.id));
  $('#app').innerHTML=`<section class="hero"><div class="eyebrow">Freshman engineering courses</div><h1>Official study sheets</h1><p>One A4 page per lesson, made from class notes. ${total} sheets across ${DATA.length} courses. Tap ☆ to keep your courses at the top.</p></section>
  ${fav.length?`<h2 class="eyebrow sec">Your favourites</h2><div class="courses">${fav.map(card).join('')}</div><h2 class="eyebrow sec">All courses</h2>`:''}
  <div class="courses">${rest.map(card).join('')}</div>
  <div class="suggest"><p><b>Have an idea?</b> Ask for a new course, a new format or a change to the site.</p><button class="btn primary" type="button" data-suggest>Suggest a change</button></div>${FOOT}`;
  wireFeedback();
  wireStars(home);
}
function course(c){
  const pk=picking&&picking.id===c.id?picking:null;
  $('#app').innerHTML=`<div class="head"><div><div class="eyebrow"><a href="#/">All courses</a></div><h1>${esc(c.code)} · ${esc(c.name)}</h1><div class="m">${c.sheets.length} sheets, in course order · updated ${fmtDate(c.at)}</div>${c.by?`<div class="by">Notes by <b>${esc(c.by)}</b></div>`:''}</div>
   <div class="row" style="display:flex;gap:8px;align-items:center">${starBtn(c)}${pk?`<button class="btn" type="button" id="pickCancel">Cancel</button>`:`<button class="btn primary" type="button" id="pickStart">Combine sheets</button>`}</div></div>
  <nav class="list${pk?' picking':''}">${c.sheets.map((s,i)=>pk
    ?`<label class="item"><input type="checkbox" data-i="${i}" ${pk.sel.has(i)?'checked':''}><span class="lab">${esc(s.label)}</span><span class="tt">${esc(s.title)}</span></label>`
    :`<a class="item" href="#/${c.id}/${i+1}"><span class="lab">${esc(s.label)}</span><span class="tt">${esc(s.title)}</span><span class="go" aria-hidden="true">›</span></a>`).join('')}</nav>
  ${pk?`<div class="pickbar"><button class="btn" type="button" id="pickAll">${pk.sel.size===c.sheets.length?'Clear all':'Select all'}</button><input type="text" id="pickTitle" placeholder="Summary title, e.g. Midterm 2 review" value="${esc(pk.title)}" aria-label="Summary title"><span class="n">${pk.sel.size} selected</span><button class="btn primary" type="button" id="pickGo" ${pk.sel.size?'':'disabled'}>Make summary</button></div>`:''}
  ${FOOT}`;
  wireStars(()=>course(c));
  if(!pk){$('#pickStart').onclick=()=>{picking={id:c.id,sel:new Set(),title:''};course(c)};return}
  $('#pickCancel').onclick=()=>{picking=null;course(c)};
  $('#pickTitle').oninput=e=>{pk.title=e.target.value};
  document.querySelectorAll('.picking input[type=checkbox]').forEach(x=>x.onchange=()=>{const i=+x.dataset.i;x.checked?pk.sel.add(i):pk.sel.delete(i);const y=scrollY;course(c);scrollTo(0,y)});
  $('#pickAll').onclick=()=>{pk.sel=pk.sel.size===c.sheets.length?new Set():new Set(c.sheets.map((_,i)=>i));const y=scrollY;course(c);scrollTo(0,y)};
  $('#pickGo').onclick=()=>{const ids=[...pk.sel].sort((a,b)=>a-b).map(i=>i+1).join('.');const t=pk.title.trim();picking=null;location.hash=`#/${c.id}/summary/${ids}${t?'/'+encodeURIComponent(t):''}`};
}

function buildSheet(c,s,mode){
  const el=document.createElement('div');
  el.className='sheet';el.dataset.style=c.style;el.dataset.mode=mode;
  const meta=c.style==='physics'?s.label:`${c.code} · ${s.label}`;
  el.innerHTML=`<header class="sh-head"><div class="sh-title">${esc(s.title)}</div><div class="sh-meta">${esc(meta)}</div></header><div class="sh-body">${s.html}</div><footer class="sh-foot"><span>${esc(c.code)} — ${esc(s.title)}</span><span>${esc(s.label)}</span></footer><div class="wm">${WM}</div>`;
  return el;
}
function addPaper(host,el){
  const paper=document.createElement('div');paper.className='paper'+(zoom?' zoom':'');
  const scaler=document.createElement('div');scaler.className='scaler';scaler.style.visibility='hidden';
  scaler.appendChild(el);paper.appendChild(scaler);host.appendChild(paper);return paper;
}
async function finish(papers,token){
  try{await MathJax.startup.promise;await MathJax.typesetPromise(papers.map(p=>p.querySelector('.scaler')))}catch(e){}
  try{await document.fonts.ready}catch(e){}
  if(token!==cur.token)return false;
  for(const p of papers){const el=p.querySelector('.sheet');if(el)fitSheet(el);p.querySelector('.scaler').style.visibility=''}
  document.querySelectorAll('.loading').forEach(x=>x.remove());
  layout();return true;
}
const modeOf=()=>sheetMode||(isDark()?'dark':'light');
const toolbar=(mode)=>`<div class="seg" role="group" aria-label="Sheet colours"><button type="button" data-m="light" aria-pressed="${mode==='light'}">Light</button><button type="button" data-m="dark" aria-pressed="${mode==='dark'}">Dark</button></div>
   <button class="btn" type="button" id="zoomBtn" aria-pressed="${zoom}">${zoom?'Fit to screen':'Full size'}</button>
   <button class="btn primary" type="button" id="dlBtn" disabled>${DL}Download PDF</button>`;
function wireToolbar(){
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{sheetMode=b.dataset.m;store.set('tn-sheet',sheetMode);render()});
  $('#zoomBtn').onclick=()=>{zoom=!zoom;document.querySelectorAll('.paper').forEach(p=>p.classList.toggle('zoom',zoom));$('#zoomBtn').textContent=zoom?'Fit to screen':'Full size';$('#zoomBtn').setAttribute('aria-pressed',zoom);layout()};
}
function download(name){
  const old=document.title;document.title=name;
  const back=()=>{document.title=old;removeEventListener('afterprint',back)};addEventListener('afterprint',back);
  window.print();setTimeout(back,4000);
}
/* Report a mistake / suggest a change: sent with Netlify Forms */
function wireFeedback(){
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{const [cid,i]=b.dataset.report.split('|');const c=DATA.find(x=>x.id===cid),s=c.sheets[+i];openFb('report',{course:c.code,sheet:`${s.label} ${s.title}`,page:location.href})});
  document.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>openFb('suggestion',{}));
}
function openFb(kind,ctx){
  const d=$('#fb'),f=$('#fbForm');
  const report=kind==='report';
  f.innerHTML=`<h2>${report?'Report a mistake':'Suggest a change'}</h2>
   <p class="sub">${report?`${esc(ctx.course)} · ${esc(ctx.sheet)}`:'Tell us what would make Tabyeed better for you.'}</p>
   ${report?'':`<label>What is it about?<select name="kind"><option>New course or sheets</option><option>New format (formula sheet, practice questions…)</option><option>A change to the site</option><option>Something else</option></select></label>`}
   <label>${report?'What is wrong, and what should it say?':'Your suggestion'}<textarea name="message" required placeholder="${report?'e.g. In the Limit Comparison box, the condition should be 0 < L < ∞':'e.g. Please add MTH103 sheets'}"></textarea></label>
   <label>Email <span>Optional, only if you want a reply</span><input type="email" name="email" autocomplete="email"></label>
   <input class="hp" name="bot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
   <p class="msg" id="fbMsg" role="status"></p>
   <div class="acts"><button class="btn" type="button" id="fbCancel">Cancel</button><button class="btn primary" type="submit" id="fbSend">Send</button></div>`;
  $('#fbCancel').onclick=()=>d.close();
  f.onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(f);
    if(!String(fd.get('message')||'').trim()){$('#fbMsg').textContent='Please write a message first.';return}
    const body=new URLSearchParams({'form-name':kind,...ctx});for(const [k,v] of fd)body.set(k,v);
    const btn=$('#fbSend');btn.disabled=true;btn.textContent='Sending…';
    try{
      const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});
      if(!r.ok)throw new Error(r.status);
      f.innerHTML=`<h2>Thank you</h2><p class="sub">${report?'We will check this sheet and fix it.':'We read every suggestion.'}</p><div class="acts"><button class="btn primary" type="button" id="fbDone">Close</button></div>`;
      $('#fbDone').onclick=()=>d.close();
    }catch(err){btn.disabled=false;btn.textContent='Send';$('#fbMsg').className='msg err';$('#fbMsg').textContent='It didn\'t send. Check your connection and try again.'}
  };
  d.showModal();f.querySelector('textarea').focus();
}

const PDFHINT=`<p class="hint">Download PDF opens your print window: choose <b>Save as PDF</b>. On iPhone, tap Share, then Save to Files.</p>`;

async function sheet(c,i){
  const s=c.sheets[i],mode=modeOf(),prev=c.sheets[i-1],next=c.sheets[i+1];
  $('#app').innerHTML=`<div class="sheetview"><div class="bar"><div class="where"><div class="eyebrow"><a href="#/${c.id}">${esc(c.code)} sheets</a></div><b>${esc(s.title)}</b><span>${esc(s.label)} · ${i+1} of ${c.sheets.length}${byLine(c,s)?` · notes by ${esc(byLine(c,s))}`:''}</span></div>${toolbar(mode)}</div>${PDFHINT}
  <div id="pages"><div class="loading">Loading sheet…</div></div>
  <div class="pager">${prev?`<a class="btn" href="#/${c.id}/${i}">‹ ${esc(prev.label)}</a>`:'<span></span>'}${next?`<a class="btn" href="#/${c.id}/${i+2}">${esc(next.label)} ›</a>`:'<span></span>'}</div>
  <div class="fbrow"><button class="btn" type="button" data-report="${c.id}|${i}">⚑ Report a mistake on this sheet</button></div>${FOOT}</div>`;
  wireToolbar();wireFeedback();
  const papers=[addPaper($('#pages'),buildSheet(c,s,mode))];
  if(await finish(papers,cur.token)){const b=$('#dlBtn');b.disabled=false;b.onclick=()=>download(`${c.code} ${s.label} ${s.title}`)}
}
async function summary(c,idx,title){
  const mode=modeOf(),list=idx.map(i=>c.sheets[i]).filter(Boolean);
  if(!list.length)return course(c);
  const name=title||`${c.code} review`;
  $('#app').innerHTML=`<div class="sheetview"><div class="bar"><div class="where"><div class="eyebrow"><a href="#/${c.id}">${esc(c.code)} sheets</a></div><b>${esc(name)}</b><span>${list.length} sheets + contents page · in course order</span></div>${toolbar(mode)}</div>${PDFHINT}
  <div id="pages"><div class="loading">Putting your summary together…</div></div>${FOOT}</div>`;
  wireToolbar();
  const host=$('#pages');
  const cover=document.createElement('div');cover.className='cover';cover.dataset.mode=mode;
  cover.innerHTML=`<div class="c-eye">${esc(c.code)} · ${esc(c.name)}</div><h1>${esc(name)}</h1><p class="c-sub">${list.length} sheets, in course order. One page per sheet.</p>${c.by?`<p class="c-by">Notes by <b>${esc(c.by)}</b></p>`:''}
   <ol>${list.map((s,k)=>`<li><span class="l">${esc(s.label)}</span><span>${esc(s.title)}</span><span class="p">${k+2}</span></li>`).join('')}</ol>
   <p class="c-foot">${WM}</p>`;
  const papers=[addPaper(host,cover),...list.map(s=>addPaper(host,buildSheet(c,s,mode)))];
  if(await finish(papers,cur.token)){const b=$('#dlBtn');b.disabled=false;b.onclick=()=>download(`${c.code} ${name}`)}
}
function layout(){
  document.querySelectorAll('.paper').forEach(paper=>{
    const sc=paper.querySelector('.scaler'),el=sc.firstChild;const k=zoom?1:Math.min(1,paper.clientWidth/794);
    sc.style.transform=k===1?'':`scale(${k})`;paper.style.height=Math.ceil(Math.min(el.offsetHeight,1123)*k)+'px';
  });
}
addEventListener('resize',layout);
addEventListener('beforeprint',()=>document.querySelectorAll('.paper').forEach(p=>p.style.height=''));
addEventListener('afterprint',layout);

/* Size the sheet body so the page fills one A4 sheet. Same rule as the Tabyeed Maker. */
function fitSheet(el){
  const body=el.querySelector('.sh-body');if(!body)return {k:1,fits:true};
  const PAGE=1124;
  const set=(k,sp=0)=>{
    body.style.setProperty('--sp',sp+'px');
    body.style.transformOrigin='0 0';body.style.transform=k===1?'':`scale(${k})`;
    body.style.width=k===1?'':`${100/k}%`;body.style.marginBottom='0px';
    const h=body.offsetHeight;body.style.marginBottom=`${-(h*(1-k))}px`;
    if(el.offsetHeight>PAGE)return false;
    for(const c of body.querySelectorAll('.grid>*,.card,.panel,.aside,.example,.band')){if(c.scrollWidth>c.clientWidth+1)return false}
    return true;
  };
  let lo=0.6,hi=1.2,best=null;
  if(set(1)){best=1;lo=1}else hi=1;
  for(let i=0;i<9;i++){const mid=(lo+hi)/2;if(set(mid)){best=mid;lo=mid}else hi=mid}
  const k=best==null?0.6:best;
  let sp=0;
  if(set(k,0)){let a=0,z=14;for(let i=0;i<7;i++){const m=(a+z)/2;if(set(k,m)){sp=m;a=m}else z=m}}
  set(k,sp);
  return {k,sp,fits:el.offsetHeight<=PAGE};
}

function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const c=DATA.find(x=>x.id===parts[0]);
  const key=location.hash;
  if(!cur||cur.key!==key)scrollTo(0,0);
  cur={key,token:Math.random()};
  if(!c)return home();
  if(parts[1]==='summary'){
    const idx=(parts[2]||'').split('.').map(n=>parseInt(n,10)-1).filter(n=>n>=0);
    let t='';try{t=decodeURIComponent(parts.slice(3).join('/'))}catch(e){}
    return summary(c,idx,t);
  }
  const i=parts[1]?parseInt(parts[1],10)-1:-1;
  if(i<0||!c.sheets[i])return course(c);
  sheet(c,i);
}
addEventListener('hashchange',render);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!document.documentElement.dataset.theme)render()});
render();
</script>
